<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classeur TCG">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="/firebase-config.js"></script>
<script src="/tesseract/tesseract.min.js"></script>
<title>Classeur TCG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap">
<style>
/* Direction C — Showcase Holographique */
@property --ha{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes holo{to{--ha:360deg}}
:root{
  --bg:#04030a; --surface:#0e0c1a; --sunk:#080614; --line:rgba(255,255,255,.09);
  --fg:#ede8ff; --muted:#5850a0; --accent:#cc0020; --accent-fg:#ffffff;
  --gold:#ffd36e; --ok:#3adea8; --warn:#ffa040; --ghost:.13;
  --holo:conic-gradient(from var(--ha),#ff6bb8,#ffd36e,#6bffb8,#6bb5ff,#c46bff,#ff6bb8);
  --display:"Bebas Neue",ui-monospace,system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0ecff; --surface:#ffffff; --sunk:#e4deff; --line:rgba(88,40,160,.12);
  --fg:#1a0838; --muted:#6050a8; --accent:#cc0020; --accent-fg:#fff;
  --gold:#c89a00; --ok:#0f8a60; --warn:#c07000; --ghost:.2; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f0ecff; --surface:#ffffff; --sunk:#e4deff; --line:rgba(88,40,160,.12);
  --fg:#1a0838; --muted:#6050a8; --accent:#cc0020; --accent-fg:#fff;
  --gold:#c89a00; --ok:#0f8a60; --warn:#c07000; --ghost:.2; color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
header.top h1{font:400 22px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 10px;font:600 12px var(--display);letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
h2{font:400 14px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Hero valeur */
.hero{position:relative;border-radius:18px;padding:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% -20%,rgba(140,0,200,.14),transparent 55%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:2px;background:conic-gradient(from var(--ha),#ff6bb8,#ffd36e,#6bffb8,#6bb5ff,#c46bff,#ff6bb8);animation:holo 6s linear infinite}
.hero .lbl{font:600 11px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero .val{font:400 clamp(40px,11vw,62px)/1 var(--display);font-variant-numeric:tabular-nums;margin:8px 0 4px}
.hero .delta{font:600 14px var(--body)}
.up{color:var(--ok)} .down{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px}
.kpi b{display:block;font:400 24px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.kpi span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.spark{width:100%;height:70px;margin-top:12px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--accent) 0%,#8800cc 100%);border:none;color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* Listes */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;width:100%}
.item img{width:44px;height:61px;object-fit:cover;border-radius:4px;background:var(--sunk);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.item .p{font:400 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.03em}

/* Séries */
.serie{margin-bottom:6px}
.serie > button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.serie > button b{font:400 18px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;flex:1}
.serie > button .chev{transition:transform .2s}
.serie.open > button .chev{transform:rotate(90deg)}
.sets{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:10px;padding:4px 0 14px;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.set{flex:0 0 auto;width:130px;aspect-ratio:63/88;border-radius:12px;overflow:hidden;position:relative;text-align:left;border:0;scroll-snap-align:start;box-shadow:0 4px 20px rgba(0,0,0,.6);transition:transform .15s}
.set:active{transform:scale(.95)}
.set-shine{position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.17) 0%,transparent 42%,rgba(255,255,255,.05) 100%);pointer-events:none;z-index:1}
.set .logo{position:absolute;top:8px;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:center;z-index:2}
.set .logo img{max-height:44px;max-width:78%;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.set .logo span{font:400 11px var(--display);color:rgba(255,255,255,.75);text-align:center;letter-spacing:.06em}
.set-body{position:absolute;bottom:0;left:0;right:0;padding:18px 9px 9px;background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:2}
.set-pct{font:400 36px/1 var(--display);color:#fff;letter-spacing:.02em}
.set-pct s{font-size:17px;text-decoration:none;opacity:.55;letter-spacing:.06em}
.set .nm{font-size:11px;font-weight:500;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;min-height:0}
.set .cnt{font:500 10px var(--body);color:rgba(255,255,255,.36);margin-top:1px;font-variant-numeric:tabular-nums}
.bar{display:none}

/* Classeur (set) */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg);border-color:rgba(255,255,255,.22)}
.chip-n{background:rgba(255,255,255,.15);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"] .chip-n{background:rgba(255,255,255,.25);color:var(--fg)}
.binder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--sunk);border-radius:14px;padding:10px;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 0,transparent 50%),repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 0,transparent 50%);background-size:14px 14px}
@media (min-width:640px){.binder{grid-template-columns:repeat(4,1fr)}}
@media (min-width:860px){.binder{grid-template-columns:repeat(6,1fr)}}
.pocket{position:relative;aspect-ratio:63/88;max-width:100%;border-radius:8px;background:var(--surface);border:1px solid var(--line);padding:0;overflow:hidden}
.pocket img{width:100%;height:100%;object-fit:cover;display:block}
.pocket.missing img{filter:grayscale(1);opacity:var(--ghost)}
.pocket .noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px var(--display);color:var(--muted);text-align:center;padding:6px}
.pocket .no{position:absolute;left:4px;bottom:4px;font:700 10px var(--display);background:color-mix(in srgb,var(--bg) 85%,transparent);color:var(--fg);padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.pocket .qty{position:absolute;right:4px;top:4px;font:700 12px var(--display);background:var(--accent);color:var(--accent-fg);padding:2px 7px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pocket .wish{position:absolute;left:4px;top:4px;font-size:13px;color:var(--accent)}
.pocket .grd{position:absolute;right:4px;bottom:4px;font:700 10px var(--display);background:var(--gold);color:#1a1200;padding:1px 5px;border-radius:4px}
.pocket .grd.pend{background:#f97316;color:#fff}
.alert-bar{background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(34,197,94,.04));border:1px solid rgba(34,197,94,.35);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.alert-bar h4{margin:0;font-size:13px;font-weight:600;color:#22c55e;letter-spacing:.05em}
.alert-item{display:flex;align-items:center;gap:10px;font-size:13px}
.alert-item .pct{font:700 13px var(--display);color:#22c55e;white-space:nowrap}
.alert-item button{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.pocket-add{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);color:#04030a;display:grid;place-items:center;font:900 22px/1 var(--body);z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .1s,background .1s}
.pocket-add::before{content:"";position:absolute;inset:-8px;border-radius:50%}
.pocket-add:active{transform:translateX(-50%) scale(.8);background:#fff}

/* Feuille (sheet) */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet .grab{width:48px;height:5px;border-radius:9px;background:var(--muted);opacity:.5;margin:0 auto 14px;cursor:grab}
.sheet-header{display:flex;align-items:center;justify-content:flex-end;margin:-4px 0 10px}
.sheet-close{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;display:grid;place-items:center;color:var(--fg)}
.detail{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px}
@media (max-width:520px){.detail{grid-template-columns:1fr}.detail .big{max-width:240px;margin:0 auto}}
.big{width:100%;border-radius:12px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.detail h3{font:400 28px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.prices div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.prices b{display:block;font:400 20px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.prices span{font-size:11px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-weight:600;font-size:13px;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;text-decoration:none}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow span{flex:1}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:transparent;width:36px;height:34px;font-size:18px;font-weight:700}
.step b{min-width:28px;text-align:center;font:700 15px var(--display)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-size:14px;color:var(--fg)}
.fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Scanner */
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:10px}
.drop .ico{width:56px;height:56px;border-radius:16px;background:var(--holo);display:grid;place-items:center}
.cand{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.cand button{flex:none;width:86px;border:2px solid transparent;border-radius:8px;padding:0;background:var(--surface);overflow:hidden}
.cand button[aria-pressed="true"]{border-color:var(--accent)}
.cand img{width:100%;aspect-ratio:63/88;object-fit:cover;display:block}
.cand small{display:block;font:600 10px var(--display);padding:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(4,3,10,.88);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-around;align-items:flex-end;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:0;color:var(--muted);min-width:44px;padding:4px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs svg{width:22px;height:22px}
nav.tabs .scan{transform:translateY(-14px)}
nav.tabs .scan .orb{width:56px;height:56px;border-radius:50%;background:conic-gradient(from var(--ha),#ff6bb8,#ffd36e,#6bffb8,#6bb5ff,#c46bff,#ff6bb8);animation:holo 5s linear infinite;display:grid;place-items:center;box-shadow:0 4px 24px rgba(180,0,220,.5);border:3px solid var(--bg)}
nav.tabs .scan .orb svg{width:24px;height:24px;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:14px;max-width:90%}
/* Scanner vidéo */
#vscan-ov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#vscan-vidwrap{flex:1;position:relative;min-height:0;overflow:hidden}
#vscan-vid{width:100%;height:100%;object-fit:cover;display:block}
#vscan-ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#vscan-frame{border:2.5px dashed rgba(255,255,255,.58);border-radius:12px;width:min(70vw,290px);aspect-ratio:2.5/3.5;box-shadow:0 0 0 4000px rgba(0,0,0,.38)}
#vscan-badge{margin-top:14px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;font-weight:600;padding:5px 14px;border-radius:20px;transition:background .2s;max-width:82vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vscan-badge.found{background:rgba(25,135,84,.92)}
#vscan-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;padding:max(12px,env(safe-area-inset-top,12px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:auto}
#vscan-mag{display:block;width:100%;height:54px;background:#000;border-top:1px solid rgba(255,255,255,.15);flex-shrink:0;image-rendering:pixelated}
#vscan-bottom{background:var(--surface);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
#vscan-inputrow{display:flex;gap:8px}
#vscan-inputrow input{flex:1;font-size:16px}
#vscan-results .vscard-grid{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.vscard{flex:0 0 auto;background:var(--sunk);border:2.5px solid transparent;border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:70px}
.vscard[aria-pressed=true]{border-color:var(--accent)}
.vscard img{width:62px;height:86px;object-fit:contain;border-radius:4px}
.vscard small{font-size:10px;max-width:66px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#vscan-confirm{display:flex;flex-direction:column;gap:8px;padding-top:2px}
@keyframes vsCardIn{from{transform:translateY(28px) scale(.84);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.vscan-found{display:flex;gap:12px;align-items:center;animation:vsCardIn .42s cubic-bezier(.34,1.56,.64,1)}
.vscan-found img{width:56px;height:78px;object-fit:cover;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.45);flex-shrink:0}
</style>

</head>
<body>
<header class="top wrap" style="padding-block:10px;margin-bottom:0">
  <h1 id="title">Ma collection</h1>
  <button class="iconbtn" id="acct" data-act="acct">Connexion</button>
  <div class="lang" role="group" aria-label="Langue des cartes">
    <button id="lang-fr" data-lang="fr" aria-pressed="true">FR</button>
    <button id="lang-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Navigation">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Valeur</button>
  <button data-tab="series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Séries</button>

<script>
"use strict";
const API = "https://api.tcgdex.net/v2";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = v => v == null || isNaN(v) ? "—" : v.toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:v>=100?0:2});
const today = () => new Date().toISOString().slice(0,10);
const VARIANTS = [["normal","Normale"],["reverse","Reverse"],["holo","Holo"],["first","1re édition"]];
const COND = ["Mint","Near Mint","Excellent","Good","Light Played","Played","Poor"];
const GRADERS = ["","PCA","PSA","CGC","BGS","Collect Aura"];

/* Table des codes imprimés sur les cartes → identifiants TCGdex */
const PRINT_CODE = {
  "SVI":"sv1","PAL":"sv2","OBF":"sv3","PAF":"sv4pt5","TEF":"sv5","TWM":"sv6","SCR":"sv7","SSP":"sv8","PRE":"sv9","SFA":"sv4pt5",
  "SSH":"swsh1","RCL":"swsh2","DAA":"swsh3","VIV":"swsh4","BST":"swsh5","CRE":"swsh6","EVS":"swsh7",
  "FST":"swsh8","BRS":"swsh9","ASR":"swsh10","LOR":"swsh11","SIT":"swsh12","CRZ":"swsh12pt5",
  "SUM":"sm1","GRI":"sm2","BUS":"sm3","CIN":"sm35","UPR":"sm5","FLI":"sm6","CES":"sm7",
  "DRM":"sm75","LOT":"sm8","TEU":"sm9","UNB":"sm10","UNM":"sm11","CEC":"sm12",
  "SVP":"svp","MEP":"mep","PR-SW":"swshp","SMP":"smp",
  "MEW":"sv3pt5","PAR":"sv4","STE":"sv6pt5",
};
let totalIdx = new Map();
function buildTotalIndex(){
  totalIdx = new Map();
  for (const [id, s] of Object.entries(S.catalog?.sets || {})){
    const t = s.official || s.total; if (!t) continue;
    if (!totalIdx.has(t)) totalIdx.set(t, []);
    totalIdx.get(t).push(id);
  }
}

/* ---------- état ---------- */
const S = {
  lang: lsGet("lang") || "fr",
  tab: "home",
  catalog: null,          // {series:[{id,name,sets:[...]}], sets:{id:set}}
  setCache: {},           // setId -> set detail
  priceCache: {},         // cardId -> {cm, tp, at}
  coll: {},               // cardId -> doc
  history: [],            // [{d,v}]
  cardPriceHist: {},      // cardId → [{d:"YYYY-MM-DD", v:number}] (90 j max)
  priceAlerts: [],        // [{cardId,name,oldPrice,newPrice,pct,date,dismissed}]
  gradeReco: null,        // null | {loading:true} | {items:[...]} | {error:"..."}
  listTab: "wish",
  openSeries: new Set(JSON.parse(lsGet("openSeries") || "[]")),
  setView: null, setFilter: "all", setCatFilter: "all",
  scan: [], scanBusy: false,
};

function lsGet(k){ try { return localStorage.getItem("ctcg_"+k); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem("ctcg_"+k, v); } catch {} }

/* ---------- stockage : db partagé entre appareils, sinon local ---------- */
const Store = {
  mode: "local", fb: null, uid: null, unsub: null,
  async init(){
    const cfg = window.FIREBASE_CONFIG || {};
    if (!cfg.apiKey) { this.loadLocal(); return; }
    try {
      const V = "11.0.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
      const [app, auth, fs] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
      const fapp = app.initializeApp(cfg);
      const a = auth.getAuth(fapp), db = fs.getFirestore(fapp);
      this.fb = {auth, a, fs, db};
      auth.onAuthStateChanged(a, user => {
        this.unsub && this.unsub(); this.unsub = null;
        this.uid = user ? user.uid : null; S.user = user;
        if (!user) { this.mode = "local"; this.loadLocal(); return; }
        this.mode = "db";
        this.migrateLocal();
        this.unsub = fs.onSnapshot(fs.collection(db, "users", user.uid, "cards"), snap => {
          const coll = {}; snap.forEach(d => { const x = d.data(); if (x && x.cardId) coll[x.cardId] = x; });
          S.coll = coll; render(); if (!this._snapped) { this._snapped = true; autoRefreshIfStale(); }
        }, e => toast("Synchronisation coupée : " + (e.code || e.message)));
        fs.getDoc(fs.doc(db, "users", user.uid, "meta", "history")).then(d => { S.history = d.exists() ? (d.data().points || []) : []; render(); }).catch(() => {});
      });
    } catch(e) { toast("Firebase indisponible, collection locale"); this.loadLocal(); }
  },
  async signIn(){
    if (!this.fb) { toast("Firebase n'est pas encore configuré"); return; }
    const {auth, a} = this.fb, p = new auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(a, p); } catch(e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(a, p); else if (e.code !== "auth/popup-closed-by-user") toast("Connexion impossible : " + e.code); }
  },
  async signOut(){ if (this.fb) await this.fb.auth.signOut(this.fb.a); },
  async migrateLocal(){
    let local = {}; try { local = JSON.parse(lsGet("coll") || "{}"); } catch {}
    const ids = Object.keys(local); if (!ids.length) return;
    const {fs, db} = this.fb;
    const ok = [];
    for (const id of ids) { try { await fs.setDoc(fs.doc(db, "users", this.uid, "cards", id), local[id], {merge: true}); ok.push(id); } catch {} }
    if (ok.length) { const left = Object.fromEntries(Object.entries(local).filter(([id]) => !ok.includes(id))); lsSet("coll", JSON.stringify(left)); }
    toast(ok.length + "/" + ids.length + " carte(s) locale(s) envoyée(s) dans ton compte");
  },
  loadLocal(){
    try { S.coll = JSON.parse(lsGet("coll") || "{}"); S.history = JSON.parse(lsGet("hist") || "[]"); S.cardPriceHist = JSON.parse(lsGet("ctcg_cph") || "{}"); S.priceAlerts = JSON.parse(lsGet("ctcg_alerts") || "[]"); } catch { S.coll = {}; S.history = []; S.cardPriceHist = {}; S.priceAlerts = []; }
    render(); autoRefreshIfStale();
  },
  async save(card){
    card = JSON.parse(JSON.stringify(card));
    S.coll[card.cardId] = card; render();
    if (this.mode === "db") { const {fs, db} = this.fb; try { await fs.setDoc(fs.doc(db, "users", this.uid, "cards", card.cardId), card); } catch(e){ toast("Enregistrement refusé : " + (e.code || e.message)); } }
    else lsSet("coll", JSON.stringify(S.coll));
  },
  async remove(cardId){
    delete S.coll[cardId]; render();
    if (this.mode === "db") { const {fs, db} = this.fb; try { await fs.deleteDoc(fs.doc(db, "users", this.uid, "cards", cardId)); } catch {} }
    else lsSet("coll", JSON.stringify(S.coll));
  },
  async saveHistory(){
    if (this.mode === "db") { const {fs, db} = this.fb; try { await fs.setDoc(fs.doc(db, "users", this.uid, "meta", "history"), {points: S.history}); } catch {} }
    else lsSet("hist", JSON.stringify(S.history));
  },
  async clearAll(){
    const ids = Object.keys(S.coll);
    S.coll = {}; S.history = []; render();
    if (this.mode === "db"){
      const {fs, db} = this.fb;
      try {
        await Promise.all([
          ...ids.map(id => fs.deleteDoc(fs.doc(db, "users", this.uid, "cards", id))),
          fs.deleteDoc(fs.doc(db, "users", this.uid, "meta", "history"))
        ]);
      } catch(e){ toast("Erreur vidage : " + (e.code || e.message)); }
    } else {
      lsSet("coll", "{}"); lsSet("hist", "[]");
    }
    toast("Collection vidée");
  }
};

/* ---------- données cartes (TCGdex) ---------- */
async function j(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

async function loadCatalog(force){
  const key = "cat_" + S.lang;
  if (!force) { try { const c = JSON.parse(lsGet(key) || "null"); if (c && Date.now() - c.at < 3*864e5) { S.catalog = c; buildTotalIndex(); render(); return; } } catch {} }
  S.catalog = null; render();
  try {
    // Charger les séries FR et EN en parallèle pour ne rien rater (promos, énergies…)
    const [frSeries, enSeries] = await Promise.all([
      j(`${API}/${S.lang}/series`).catch(() => []),
      S.lang !== "en" ? j(`${API}/en/series`).catch(() => []) : Promise.resolve([])
    ]);
    const out = []; const sets = {};
    // 1) Séries de la langue principale
    await pool(frSeries, 6, async s => {
      try {
        const d = await j(`${API}/${S.lang}/series/${encodeURIComponent(s.id)}`);
        const ss = (d.sets || []).map(x => ({id:x.id, name:x.name, logo:x.logo, symbol:x.symbol, total:x.cardCount?.total||0, official:x.cardCount?.official||x.cardCount?.total||0, serie:s.id}));
        ss.forEach(x => sets[x.id] = x);
        out.push({id:s.id, name:s.name, logo:s.logo, releaseDate:d.releaseDate || "", order:frSeries.indexOf(s), sets: ss});
      } catch {}
    });
    // 2) Séries EN manquantes (promos, énergies, sets sans traduction FR)
    const frIds = new Set(frSeries.map(s => s.id));
    const enOnly = enSeries.filter(s => !frIds.has(s.id));
    await pool(enOnly, 6, async s => {
      try {
        const d = await j(`${API}/en/series/${encodeURIComponent(s.id)}`);
        const ss = (d.sets || []).map(x => ({id:x.id, name:x.name, logo:x.logo, symbol:x.symbol, total:x.cardCount?.total||0, official:x.cardCount?.official||x.cardCount?.total||0, serie:s.id}));
        ss.forEach(x => sets[x.id] = x);
        out.push({id:s.id, name:s.name, logo:s.logo, releaseDate:d.releaseDate || "", order:frSeries.length + enOnly.indexOf(s), sets: ss});
      } catch {}
    });
    // 3) Sets orphelins non rattachés à une série (promos spéciales, énergies, CLC…)
    //    Fetch liste plate FR + EN, ajouter tout ce qui n'a pas encore été vu
    try {
      const [frFlat, enFlat] = await Promise.all([
        j(`${API}/${S.lang}/sets`).catch(() => []),
        S.lang !== "en" ? j(`${API}/en/sets`).catch(() => []) : Promise.resolve([])
      ]);
      const knownIds = new Set(Object.keys(sets));
      // FR d'abord, puis EN pour ne pas écraser
      const orphans = new Map();
      for (const x of [...frFlat, ...enFlat]) {
        if (!knownIds.has(x.id) && !orphans.has(x.id)) orphans.set(x.id, x);
      }
      if (orphans.size > 0) {
        const miscSets = [...orphans.values()].map(x => ({
          id:x.id, name:x.name||x.id, logo:x.logo||"", symbol:x.symbol||"",
          total:x.cardCount?.total||0, official:x.cardCount?.official||x.cardCount?.total||0,
          serie:"_misc"
        }));
        miscSets.forEach(x => sets[x.id] = x);
        out.push({id:"_misc", name:"Promos & Divers", logo:"", releaseDate:"", order:9999, sets: miscSets});
      }
    } catch {}
    out.sort((a,b) => (b.releaseDate||"").localeCompare(a.releaseDate||"") || b.order - a.order);
    S.catalog = {at: Date.now(), series: out, sets};
    buildTotalIndex();
    lsSet(key, JSON.stringify(S.catalog));
  } catch(e) { S.catalog = {error: true, series: [], sets: {}}; }
  render();
}

async function loadSet(id){
  const k = S.lang + ":" + id;
  if (S.setCache[k]) return S.setCache[k];
  let d;
  if (S.lang === "en") {
    try { d = await j(`${API}/en/sets/${encodeURIComponent(id)}`); } catch {}
  } else {
    // Fetch FR et EN en parallèle — utilise celui qui a le plus de cartes
    const [rFr, rEn] = await Promise.allSettled([
      j(`${API}/${S.lang}/sets/${encodeURIComponent(id)}`),
      j(`${API}/en/sets/${encodeURIComponent(id)}`)
    ]);
    const dFr = rFr.status === "fulfilled" ? rFr.value : null;
    const dEn = rEn.status === "fulfilled" ? rEn.value : null;
    d = (dEn?.cards?.length || 0) > (dFr?.cards?.length || 0) ? dEn : (dFr || dEn);
  }
  if (!d) throw new Error("Set introuvable");
  d.cards = (d.cards || []).slice().sort((a,b) => natCmp(a.localId, b.localId));
  // Enrichir avec category/rarity si absents des résumés (TCGdex CardBrief n'inclut pas ces champs)
  if (!d.cards.some(c => c.category)) {
    try {
      const cats = await j(`${API}/en/cards?set.id=${encodeURIComponent(id)}`);
      if (Array.isArray(cats) && cats.length && cats[0].category) {
        const byId = new Map(cats.map(c => [c.id, {category: c.category, rarity: c.rarity}]));
        d.cards.forEach(c => { const x = byId.get(c.id); if (x) { c.category = x.category; c.rarity = x.rarity; } });
      }
    } catch {}
  }
  return S.setCache[k] = d;
}
function natCmp(a,b){ const na = parseInt(a,10), nb = parseInt(b,10); if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb; return String(a).localeCompare(String(b), "fr", {numeric:true}); }

async function loadCard(id){
  let d; try { d = await j(`${API}/${S.lang}/cards/${encodeURIComponent(id)}`); } catch {}
  if (!d || !d.pricing) { try { const en = await j(`${API}/en/cards/${encodeURIComponent(id)}`); d = d ? {...d, pricing: en.pricing} : en; } catch {} }
  return d;
}

/* prix : Cardmarket (EUR) en priorité, TCGplayer (USD) à titre indicatif */
function priceOf(pricing, variant){
  const cm = pricing?.cardmarket || null, tp = pricing?.tcgplayer || null;
  const holo = variant === "reverse" || variant === "holo";
  const pick = (...vals) => vals.find(v => typeof v === "number" && v > 0) ?? null;
  const c = cm ? {
    trend: holo ? pick(cm["trend-holo"], cm.trendHolo, cm.trend) : pick(cm.trend, cm.avg),
    avg:   holo ? pick(cm["avg-holo"], cm.avgHolo, cm.avg) : pick(cm.avg, cm.avg30),
    low:   holo ? pick(cm["low-holo"], cm.lowHolo, cm.low) : pick(cm.low),
    avg7:  holo ? pick(cm["avg7-holo"], cm.avg7) : pick(cm.avg7),
    avg30: holo ? pick(cm["avg30-holo"], cm.avg30) : pick(cm.avg30),
    updated: cm.updated || cm.updatedAt || null,
  } : null;
  let t = null;
  if (tp) { const keys = holo ? ["reverse-holofoil","reverseHolofoil","holofoil"] : ["normal","holofoil","1st-edition-holofoil"]; for (const k of keys) if (tp[k]) { t = pick(tp[k].marketPrice, tp[k].market, tp[k].midPrice, tp[k].mid); if (t) break; } }
  return { cm: c, tp: t, main: c ? pick(c.trend, c.avg, c.avg7) : null };
}

function cardValue(doc){
  let v = 0, priced = false;
  for (const [k] of VARIANTS) { const q = doc.v?.[k] || 0; if (!q) continue; const p = doc.prices?.[k] ?? doc.prices?.normal; if (p) { v += q * p; priced = true; } }
  if (doc.grade?.value) { v = doc.grade.value * qty(doc); priced = true; }
  return priced ? v : null;
}
const qty = d => VARIANTS.reduce((s,[k]) => s + (d.v?.[k]||0), 0);

async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } })); }

async function refreshPrices(btn){
  const docs = Object.values(S.coll); if (!docs.length) return;
  btn && (btn.disabled = true);
  // Capture des anciens prix avant mise à jour (pour détection de hausse)
  const oldPrices = Object.fromEntries(docs.map(d => [d.cardId, d.prices?.normal ?? null]));
  let done = 0;
  await pool(docs, 4, async d => {
    const c = await loadCard(d.cardId); done++;
    if (btn) btn.textContent = `Prix… ${done}/${docs.length}`;
    if (!c?.pricing) return;
    const prices = {}; for (const [k] of VARIANTS) prices[k] = priceOf(c.pricing, k).main;
    if (JSON.stringify(prices) !== JSON.stringify(d.prices)) await Store.save({...S.coll[d.cardId] || d, prices, priceSource:"Cardmarket via TCGdex", priceAt: Date.now()});
    const pv = prices.normal ?? prices.holo ?? prices.reverse ?? null;
    if (pv != null) {
      const ph = (S.cardPriceHist[d.cardId] || []).filter(p => p.d !== today());
      ph.push({d: today(), v: Math.round(pv*100)/100});
      S.cardPriceHist[d.cardId] = ph.slice(-90);
    }
  });
  try { lsSet("ctcg_cph", JSON.stringify(S.cardPriceHist)); } catch {}
  // Détection de hausses significatives (≥25% ET ≥2€)
  const newAlerts = [];
  for (const d of docs) {
    const old = oldPrices[d.cardId]; if (!old || old < 1) continue;
    const cur = S.coll[d.cardId]?.prices?.normal; if (!cur) continue;
    const pct = (cur - old) / old;
    if (pct >= 0.25 && cur - old >= 2) {
      const exists = S.priceAlerts.some(a => a.cardId === d.cardId && a.date === today());
      if (!exists) newAlerts.push({cardId:d.cardId, name:d.name, image:d.image||"", oldPrice:Math.round(old*100)/100, newPrice:Math.round(cur*100)/100, pct:Math.round(pct*100), date:today(), dismissed:false});
    }
  }
  if (newAlerts.length) {
    S.priceAlerts = [...S.priceAlerts.slice(-50), ...newAlerts];
    try { lsSet("ctcg_alerts", JSON.stringify(S.priceAlerts)); } catch {}
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      newAlerts.forEach(a => { try { new Notification(`📈 ${a.name} +${a.pct}%`, {body:`${eur(a.oldPrice)} → ${eur(a.newPrice)} · Classeur TCG`, icon:"/icon.svg"}); } catch {} });
    }
  }
  const total = totals().value;
  const h = S.history.filter(p => p.d !== today()); h.push({d: today(), v: Math.round(total*100)/100});
  S.history = h.slice(-400); await Store.saveHistory();
  if (btn) { btn.disabled = false; btn.textContent = "Actualiser les prix"; }
  toast("Prix à jour"); render();
}

function autoRefreshIfStale(){
  const docs = Object.values(S.coll); if (!docs.length) return;
  const lastAt = docs.reduce((m, d) => Math.max(m, d.priceAt || 0), 0);
  if (Date.now() - lastAt > 23 * 3600e3) setTimeout(() => refreshPrices(null), 800);
}

function totals(){
  const docs = Object.values(S.coll);
  let value = 0, cards = 0, uniq = 0, dupes = 0, paid = 0;
  docs.forEach(d => { const q = qty(d); if (!q) return; uniq++; cards += q; dupes += Math.max(0, q-1); value += cardValue(d) || 0; paid += (d.paid || 0); });
  return {value, cards, uniq, dupes, paid};
}
function ownedInSet(setId){ return Object.values(S.coll).filter(d => d.setId === setId && qty(d) > 0).length; }

/* ---------- rendu ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const acct = $("#acct"); if (acct) { acct.hidden = !window.FIREBASE_CONFIG?.apiKey; acct.textContent = S.user ? "Déconnexion" : "Connexion"; acct.title = S.user ? (S.user.email || "") : "Se connecter avec Google pour synchroniser"; }
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  const app = $("#app");
  const titles = {home:"Ma collection", series:"Séries", scan:"Scanner", search:"Chercher", lists:"Listes", set: S.setView ? (S.catalog?.sets?.[S.setView]?.name || "Extension") : ""};
  $("#title").textContent = titles[S.tab];
  if (S.tab === "home") app.innerHTML = viewHome();
  else if (S.tab === "series") app.innerHTML = viewSeries();
  else if (S.tab === "set") viewSet(app);
  else if (S.tab === "scan") { app.innerHTML = viewScan(); }
  else if (S.tab === "search") { if (!$("#q")) app.innerHTML = viewSearch(); }
  else if (S.tab === "lists") app.innerHTML = viewLists();
}

function sparkline(points){
  if (points.length < 2) return `<p class="muted" style="margin:10px 0 0;font-size:13px">La courbe de valeur apparaît après deux actualisations des prix, à des jours différents.</p>`;
  const W = 600, H = 70, vs = points.map(p => p.v), min = Math.min(...vs), max = Math.max(...vs), r = (max - min) || 1;
  const xy = points.map((p,i) => [i*(W-8)/(points.length-1)+4, H-6-(p.v-min)/r*(H-14)]);
  const d = xy.map((p,i) => (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Évolution de la valeur">
    <path d="${d} L${last[0]} ${H} L4 ${H} Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}

function cardSparkline(pts){
  if (!pts || pts.length < 2) return "";
  const W = 600, H = 160, ML = 50, MR = 10, MT = 14, MB = 26;
  const cW = W-ML-MR, cH = H-MT-MB;
  const vs = pts.map(p => p.v);
  const vMin = Math.min(...vs), vMax = Math.max(...vs);
  const vPad = (vMax-vMin)*0.18 || vMax*0.12 || 0.5;
  const yMin = Math.max(0, vMin-vPad), rY = (vMax+vPad) - yMin;
  // X : position temporelle réelle si dates ISO, sinon uniforme
  const toTs = d => { const t = new Date(d).getTime(); return isNaN(t) ? null : t; };
  const tss = pts.map(p => toTs(p.d));
  const useTime = tss.every(t => t !== null);
  const tMin = useTime ? tss[0] : 0, tR = useTime ? (tss[tss.length-1]-tMin)||1 : pts.length-1;
  const toX = i => ML + (useTime ? (tss[i]-tMin)/tR : i/(pts.length-1)) * cW;
  const toY = v => MT + cH - (v-yMin)/rY*cH;
  const xy = pts.map((_,i) => [toX(i), toY(pts[i].v)]);
  // Courbe lissée Catmull-Rom → cubic Bézier
  function smooth(ps){
    let d = `M${ps[0][0].toFixed(1)},${ps[0][1].toFixed(1)}`;
    for (let i = 0; i < ps.length-1; i++){
      const p0=ps[Math.max(i-1,0)], p1=ps[i], p2=ps[i+1], p3=ps[Math.min(i+2,ps.length-1)];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }
  const line = smooth(xy);
  const [lx,ly] = xy[xy.length-1];
  const up = pts[pts.length-1].v >= pts[0].v;
  const col = up ? "#22c55e" : "#ef4444";
  const aBot = MT+cH;
  // Grille Y (4 lignes)
  const grid = Array.from({length:5},(_,i)=>{
    const v = yMin + rY*i/4, y = toY(v).toFixed(1);
    const lbl = v>=100 ? v.toFixed(0)+"€" : v>=10 ? v.toFixed(1)+"€" : v.toFixed(2)+"€";
    return `<line x1="${ML}" y1="${y}" x2="${W-MR}" y2="${y}" stroke="currentColor" stroke-opacity=".07"/>
      <text x="${ML-4}" y="${(+y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="currentColor" opacity=".4">${lbl}</text>`;
  }).join("");
  // Labels X : début, milieu (si > 4 pts), fin
  const xIdxs = pts.length<=4 ? pts.map((_,i)=>i) : [0,Math.floor(pts.length/2),pts.length-1];
  const xLbls = xIdxs.map(i=>{
    const x=toX(i).toFixed(1), lbl=pts[i].lbl||pts[i].d.slice(5).replace("-","/");
    const a = i===0?"start":i===pts.length-1?"end":"middle";
    return `<text x="${x}" y="${H-5}" text-anchor="${a}" font-size="9" fill="currentColor" opacity=".45">${esc(lbl)}</text>`;
  }).join("");
  // Prix actuel
  const pLbl = eur(pts[pts.length-1].v);
  const pLy = Math.max(ly-9, MT+12).toFixed(1);
  const pLx = lx > W*0.72 ? lx-6 : lx+6;
  const pAnchor = lx > W*0.72 ? "end" : "start";
  return `<div style="width:100%;aspect-ratio:600/160;margin:8px 0">
    <svg style="width:100%;height:100%" viewBox="0 0 ${W} ${H}" aria-label="Évolution du prix Cardmarket">
      <defs>
        <linearGradient id="cpg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity=".3"/>
          <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="cpc"><rect x="${ML}" y="${MT}" width="${cW}" height="${cH+1}"/></clipPath>
      </defs>
      ${grid}
      <path d="${line} L${lx.toFixed(1)},${aBot} L${ML},${aBot} Z" fill="url(#cpg)" clip-path="url(#cpc)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" clip-path="url(#cpc)"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="${col}"/>
      <text x="${pLx.toFixed(1)}" y="${pLy}" text-anchor="${pAnchor}" font-size="11" font-weight="600" fill="${col}">${pLbl}</text>
      ${xLbls}
    </svg>
  </div>`;
}

function viewSeries(){
  const c = S.catalog;
  if (!c) return `<p class="muted"><span class="spinner"></span> Chargement des séries…</p>`;
  if (c.error) return `<div class="note">Impossible de joindre la base de cartes. Vérifie ta connexion puis <button class="btn" data-act="reloadcat">Réessayer</button></div>`;
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="iconbtn" data-act="reloadcat" style="font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)">↻ Actualiser le catalogue</button></div>` +
  c.series.map(s => {
    const open = S.openSeries.has(s.id);
    const own = s.sets.reduce((n, x) => n + ownedInSet(x.id), 0), tot = s.sets.reduce((n, x) => n + (x.official||0), 0);
    return `<div class="serie ${open?"open":""}"><button data-serie="${esc(s.id)}" aria-expanded="${open}">
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg>

function setTile(x){
  const own = ownedInSet(x.id), tot = x.official || x.total || 0, pct = tot ? Math.min(100, own/tot*100) : 0;
  const _lsrc = x.logo ? `${esc(x.logo)}.webp` : `/_`;
  // Gradient unique dérivé du hash de l'ID
  let h = 0; for (let i = 0; i < x.id.length; i++) h = (h * 31 + x.id.charCodeAt(i)) & 0xffffffff;
  const hu = (Math.abs(h) % 300 + 180) % 360, hu2 = (hu + 45) % 360;
  const bg = `linear-gradient(160deg,hsl(${hu},62%,9%),hsl(${hu2},50%,16%))`;
  return `<button class="set" data-set="${esc(x.id)}" style="background:${bg}">
    <div class="set-shine"></div>
    <div class="logo"><img src="${_lsrc}" alt="" loading="lazy" data-symbol="${esc(x.symbol||"")}" data-setid="${esc(x.id)}" onerror="logoFb(this)"></div>
    <div class="set-body">
      <div class="set-pct">${Math.round(pct)}<s>%</s></div>
      <div class="nm">${esc(x.name)}</div>
      <div class="cnt">${own}/${tot}</div>
    </div></button>`;
}

const RINFO = { // [label FR, ordre]
  "common":                    ["Commune ●",       1],
  "uncommon":                  ["Peu commune ◆",   2],
  "rare":                      ["Rare ★",          3],

};
const normStr = s => (s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
function matchCat(c, cf){
  if (cf === "all") return true;
  const cat = normStr(c.category);
  if (cf === "trainer") return cat === "trainer" || cat === "dresseur";
  if (cf === "energy")  return cat === "energy"  || cat === "energie";
  return normStr(c.rarity) === cf; // correspondance exacte sur la rareté normalisée
}
async function viewSet(app){
  const id = S.setView, meta = S.catalog?.sets?.[id];
  if (!S.setCache[S.lang + ":" + id]) app.innerHTML = `<p class="muted"><span class="spinner"></span> Chargement de l'extension…</p>`;
  let set; try { set = await loadSet(id); } catch { app.innerHTML = `<div class="note">Extension introuvable dans cette langue.</div>`; return; }
  if (S.tab !== "set" || S.setView !== id) return;
  const f = S.setFilter, cf = S.setCatFilter;
  const cards = set.cards.filter(c => {
    const d = S.coll[c.id], q = d ? qty(d) : 0;
    return (f === "all" || (f === "own" && q) || (f === "miss" && !q) || (f === "dup" && q > 1))
        && matchCat(c, cf);
  });
  const own = ownedInSet(id), tot = set.cardCount?.official || meta?.official || set.cards.length;
  // Chips dynamiques : rarités réelles présentes dans le set + Dresseur + Énergie
  const rarCounts = new Map(); // rarity normalisée → count
  let trnCnt = 0, eneCnt = 0;
  for (const c of set.cards) {
    const cat = normStr(c.category);
    if (cat === "trainer" || cat === "dresseur") { trnCnt++; continue; }
    if (cat === "energy"  || cat === "energie")  { eneCnt++; continue; }
    const r = normStr(c.rarity);
    if (r) rarCounts.set(r, (rarCounts.get(r)||0)+1);
  }
  const rarChips = [...rarCounts.entries()]
    .sort((a,b) => (RINFO[a[0]]?.[1]??50) - (RINFO[b[0]]?.[1]??50))
    .map(([r,n]) => {
      const lbl = RINFO[r]?.[0] || r.replace(/\b\w/g, c=>c.toUpperCase());
      return `<button class="chip chip-cat" data-catfilter="${esc(r)}" aria-pressed="${cf===r}">${esc(lbl)} <span class="chip-n">${n}</span></button>`;
    }).join("");
  app.innerHTML = `
  <div class="toolbar">
    <button class="iconbtn" data-act="back" aria-label="Retour aux séries">← Séries</button>
    <span class="num" style="font-weight:700">${own}/${tot}</span><span class="muted" style="font-size:13px">${set.cards.length > tot ? `(+${set.cards.length - tot} secrètes)` : ""}</span>
  </div>
  <div class="chips" role="group" aria-label="Filtre collection" style="margin-bottom:6px">
    ${[["all","Toutes"],["own","Possédées"],["miss","Manquantes"],["dup","Doubles"]].map(([k,l]) => `<button class="chip" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}
  </div>
  <div class="chips" role="group" aria-label="Filtre type" style="margin-bottom:12px">
    <button class="chip chip-cat" data-catfilter="all" aria-pressed="${cf==="all"}">Tout <span class="chip-n">${set.cards.length}</span></button>
    ${rarChips}
    ${trnCnt ? `<button class="chip chip-cat" data-catfilter="trainer" aria-pressed="${cf==="trainer"}">Dresseur <span class="chip-n">${trnCnt}</span></button>` : ""}
    ${eneCnt ? `<button class="chip chip-cat" data-catfilter="energy" aria-pressed="${cf==="energy"}">Énergie <span class="chip-n">${eneCnt}</span></button>` : ""}
    ${!rarChips && !trnCnt && !eneCnt ? `<span class="muted" style="font-size:12px">Catégories non disponibles pour ce set</span>` : ""}
  </div>
  ${cards.length ? `<div class="binder">${cards.map(c => {
    const d = S.coll[c.id], q = d ? qty(d) : 0;
    return `<button class="pocket ${q?"":"missing"}" data-open="${esc(c.id)}" aria-label="${esc(c.name)} n°${esc(c.localId)}${q?", "+q+" exemplaire(s)":", manquante"}">
      <img src="${esc(c.image ? c.image+"/low.webp" : "/_")}" data-set="${esc(c.setId)}" data-local="${esc(c.localId)}" alt="" loading="lazy" onerror="imgFb(this)">
      <span class="no">${esc(c.localId)}</span>${q > 1 ? `<span class="qty">×${q}</span>` : ""}${d?.wish && !q ? `<span class="wish">♥</span>` : ""}${d?.grade?.co ? (d.grade?.status==="pending" ? `<span class="grd pend">⏳${esc(d.grade.co)}</span>` : `<span class="grd">${esc(d.grade.co)} ${esc(d.grade.note||"")}</span>`) : ""}
      <span class="pocket-add" data-quickadd="${esc(c.id)}" aria-label="Ajouter ${esc(c.name)}">+</span>
    </button>`; }).join("")}</div>` : `<div class="empty">Aucune carte pour ce filtre.</div>`}`;
}

// Détecte si la saisie ressemble à un numéro de carte (ex: 136, 136/189, SV001, TG03)
function isNumQuery(q){ return /^[A-Za-z]{0,4}\d+(?:\/\d+)?$/.test(q.trim()); }
function parseNumQuery(q){
  const m = q.trim().match(/^([A-Za-z]{0,4}\d+)(?:\/(\d+))?$/);
  return m ? {localId: m[1], total: m[2] ? parseInt(m[2]) : null} : null;
}
async function doSearch(q){
  const box = $("#results"); if (!box) return;
  const isNum = isNumQuery(q);
  const numP = isNum ? parseNumQuery(q) : null;
  if (q.length < (isNum ? 2 : 3)) return;
  box.innerHTML = `<p class="muted"><span class="spinner"></span> Recherche…</p>`;
  try {
    const param = isNum ? `localId=${encodeURIComponent(numP.localId)}` : `name=${encodeURIComponent(q)}`;
    const res = await j(`${API}/${S.lang}/cards?${param}`);
    if ($("#q")?.value.trim() !== q) return;
    let list = (res || []).map(c => ({...c, setId: c.id.slice(0, c.id.lastIndexOf("-"))}));
    // Si "136/189" : ne garder que les cartes dont l'extension a exactement 189 cartes officielles
    if (numP?.total) list = list.filter(c => { const s = S.catalog?.sets?.[c.setId]; return s && (s.official === numP.total || s.total === numP.total); });
    box.innerHTML = list.length ? `<div class="binder">${list.slice(0, 120).map(c => { const d = S.coll[c.id], qn = d ? qty(d) : 0;
      const cinfo = esc(JSON.stringify({name:c.name,setId:c.setId,localId:c.localId,image:c.image||""}));
      return `<button class="pocket ${qn?"":"missing"}" data-open="${esc(c.id)}" aria-label="${esc(c.name)}">${c.image ? `<img src="${esc(c.image)}/low.webp" alt="" loading="lazy">` : `<span class="noimg">${esc(c.name)}</span>`}
      <span class="no">${esc(S.catalog?.sets?.[c.setId]?.name?.slice(0,14) || c.setId)} ${esc(c.localId)}</span>${qn>1?`<span class="qty">×${qn}</span>`:""}
      <span class="pocket-add" data-quickadd="${esc(c.id)}" data-qacinfo="${cinfo}" aria-label="Ajouter ${esc(c.name)}">+</span></button>`; }).join("")}</div>
      <p class="muted" style="font-size:12px">${list.length} résultat(s)${isNum ? ` pour le n° ${esc(q.trim())}` : ""}. Les cartes en gris ne sont pas dans ta collection.</p>` : `<div class="empty">Aucune carte ${isNum ? `n° ${esc(q.trim())}` : `« ${esc(q)} »`}.</div>`;
  } catch { box.innerHTML = `<div class="note">Recherche impossible pour le moment.</div>`; }
}

function viewLists(){
  const all = Object.values(S.coll);

  const pending = all.filter(d => d.grade?.status === "pending" && qty(d));
  const graded  = all.filter(d => d.grade?.co && d.grade?.status !== "pending" && qty(d));
  const L = S.listTab;
  const sum = L==="wish" ? wish.reduce((s,d)=>s+(d.prices?.normal||0),0) :
              L==="dup"  ? dup.reduce((s,d)=>s+(cardValue(d)||0)/qty(d)*(qty(d)-1),0) :
              L==="graded" ? graded.reduce((s,d)=>s+(cardValue(d)||0),0) : 0;
  const label = {wish:"Coût estimé",dup:"Valeur des doubles",graded:"Valeur des cartes gradées"}[L]||"";
  const chips = `<div class="chips" role="group" style="margin-bottom:12px">

  return chips +
    (label && sum ? `<div class="note" style="margin-bottom:12px">${label} : <b class="num" style="color:var(--fg)">${eur(sum)}</b></div>` : "") +

}

async function analyzeForGrading(){
  const inp = document.getElementById("grade-threshold");
  const threshold = inp ? (parseFloat(inp.value) || 15) : (S.gradeThreshold || 15);
  S.gradeThreshold = threshold;
  // Cartes possédées dont la valeur dépasse le seuil
  const candidates = Object.values(S.coll)
    .filter(d => qty(d) && !d.grade?.co)
    .map(d => ({ cardId:d.cardId, name:d.name, setId:d.setId, value: cardValue(d)||0, image:d.image||"" }))
    .filter(d => d.value >= threshold)
    .sort((a,b) => b.value - a.value)
    .slice(0, 30);
  if (!candidates.length) {
    S.gradeReco = { error: `Aucune carte non gradée ne dépasse ${threshold} €.` };
    render(); return;
  }
  S.gradeReco = { loading: true }; render();
  try {
    const res = await fetch("/api/grade-analysis", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: candidates, threshold })
    });
    const data = await res.json();
    if (!res.ok) { S.gradeReco = { error: data.error || "Erreur serveur" }; }
    else {
      const items = (data.recommendations || []).map(r => ({
        ...r,
        cardId: r.cardId || (candidates.find(c => c.name === r.name)?.cardId || ""),
        image:  r.image  || (candidates.find(c => c.name === r.name)?.image || "")
      }));
      S.gradeReco = { items };
    }
  } catch(e) { S.gradeReco = { error: e.message || "Réseau indisponible" }; }
  render();
}

let _ocrWorker = null;
async function getOcrWorker() {
  if (_ocrWorker) return _ocrWorker;
  if (!window.Tesseract) throw new Error("Tesseract.js non disponible");
  const _o = location.origin;
  _ocrWorker = await Tesseract.createWorker("eng", 1, {
    workerPath:    _o + "/tesseract/worker.min.js",
    corePath:      _o + "/tesseract/tesseract-core-lstm.wasm.js",
    langPath:      _o + "/tesseract/lang/",
    workerBlobURL: false,
    logger: () => {},
  });
  return _ocrWorker;
}

/* Détecte le rectangle de la carte par projection de gradient Sobel.
   Les bords de la carte créent des pics nets dans la projection ; fonctionne
   aussi bien pour une photo directe que pour une capture d'écran eBay/shop.
   Retourne {x,y,w,h} dans les coords originales, ou l'image entière en fallback. */
function detectCard(bmp) {
  const MAX = 500;
  const ratio = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const sw = Math.round(bmp.width * ratio), sh = Math.round(bmp.height * ratio);
  const tmp = document.createElement("canvas");
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext("2d");
  tctx.drawImage(bmp, 0, 0, sw, sh);
  const px = tctx.getImageData(0, 0, sw, sh).data;

  const gv = new Uint8Array(sw * sh);
  for (let i = 0; i < gv.length; i++)
    gv[i] = (77*px[i*4] + 150*px[i*4+1] + 29*px[i*4+2]) >> 8;

  // Projection du gradient : somme du module Sobel par ligne / colonne
  const rp = new Float32Array(sh), cp = new Float32Array(sw);
  for (let y = 1; y < sh - 1; y++)
    for (let x = 1; x < sw - 1; x++) {
      const gx = gv[y*sw+x+1] - gv[y*sw+x-1];
      const gy = gv[(y+1)*sw+x] - gv[(y-1)*sw+x];
      const m = Math.sqrt(gx*gx + gy*gy);
      rp[y] += m; cp[x] += m;
    }

  // Lissage ±5 px pour réduire le bruit
  const smooth = (a, r) => {
    const b = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) {
      let s = 0, n = 0;
      for (let j = Math.max(0,i-r); j <= Math.min(a.length-1,i+r); j++,n++) s += a[j];
      b[i] = s / n;
    }
    return b;
  };
  const srp = smooth(rp, 5), scp = smooth(cp, 5);

  // Premier et dernier pic local au-dessus de 15 % du max
  // (les transitions fond↔carte créent les pics extrêmes les plus forts)
  const outerPeaks = (a, minH) => {
    let first = -1, last = -1;
    for (let i = 1; i < a.length - 1; i++) {
      if (a[i] > a[i-1] && a[i] > a[i+1] && a[i] > minH) {
        if (first < 0) first = i;
        last = i;
      }
    }
    return [first < 0 ? 0 : first, last < 0 ? a.length-1 : last];
  };

  let maxR = 0, maxC = 0;
  for (let i = 0; i < srp.length; i++) if (srp[i] > maxR) maxR = srp[i];
  for (let i = 0; i < scp.length; i++) if (scp[i] > maxC) maxC = scp[i];

  const [top, bot] = outerPeaks(srp, maxR * 0.15);
  const [lft, rgt] = outerPeaks(scp, maxC * 0.15);

  // Sanité : couvre au moins 30 % de chaque dimension
  if ((rgt - lft) < sw * 0.30 || (bot - top) < sh * 0.30)
    return { x: 0, y: 0, w: bmp.width, h: bmp.height, _detected: false };

  const pad = Math.round(8 / ratio);
  const ox = Math.max(0, Math.round(lft / ratio) - pad);
  const oy = Math.max(0, Math.round(top / ratio) - pad);
  const or = Math.min(bmp.width,  Math.round(rgt / ratio) + pad);
  const ob = Math.min(bmp.height, Math.round(bot / ratio) + pad);
  return { x: ox, y: oy, w: or - ox, h: ob - oy, _detected: true };
}

function buildOcrCanvas(bmp, rx, ry, rw, rh, scale = 3) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(rw * scale); cv.height = Math.round(rh * scale);
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bmp, rx, ry, rw, rh, 0, 0, cv.width, cv.height);
  const id = ctx.getImageData(0, 0, cv.width, cv.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
    const c = g < 140 ? Math.max(0, g - 40) : Math.min(255, g + 40);
    d[i] = d[i+1] = d[i+2] = c;
  }
  ctx.putImageData(id, 0, 0);
  return cv;
}

async function ocrCanvas(worker, canvas, psm, whitelist = "") {
  await worker.setParameters({ tessedit_pageseg_mode: psm, tessedit_char_whitelist: whitelist });
  const { data: { text } } = await worker.recognize(canvas);
  return text.trim();
}

function parseOcrNumber(txt) {
  const m = txt.match(/(\d{1,4})\s*[\/|\\]\s*(\d{1,4})/) ||
            txt.match(/([A-Z]{1,4}\d{1,4})\s*[\/|\\]\s*(\d{1,4})/) ||
            txt.match(/([A-Z]{2,5}\d{2,4})/);
  if (!m) return { number: "", total: "", setCode: "" };
  const number = m[1].replace(/O/g, "0").replace(/l/g, "1").replace(/I/g, "1");
  const total = (m[2] || "").replace(/O/g, "0");
  // Cherche un code d'extension connu dans le texte OCR (ex: SVI, PAL, 30C…)
  const upper = txt.toUpperCase();
  let setCode = Object.keys(PRINT_CODE).find(c => upper.includes(c)) || "";
  if (!setCode) {
    const skip = new Set(["GAME","FREAK","POKE","EMON","ILLUS","TAILLE","POIDS","OKAY"]);
    setCode = (txt.match(/\b([A-Z]{2,5})\b/g) || []).find(c => !skip.has(c)) || "";
  }
  return { number, total, setCode };
}

function parseOcrName(txt) {
  return txt
    .split("\n")[0]
    .replace(/\s*HP\s*\d+/i, "")
    .replace(/[^\p{L}\p{N}\s\-'\.]/gu, " ")
    .replace(/\s+/g, " ")
    .trim()
    // Retire un préfixe parasite de 1-2 chars suivi d'une majuscule (ex: "Il Pikachu")
    // sauf abréviations connues dans les noms Pokémon : Mr, Lt
    .replace(/^(?!Mr\s|Lt\s)[A-Za-z]{1,2}\s+(?=[A-ZÀÁÂÄÆÇÈÉÊËÎÏÔÙÚÛÜ])/u, "")
    // Retire les chiffres parasites en fin de nom (ex: "Pikachu 704")
    .replace(/\s+\d+$/, "")
    .slice(0, 50);
}

/* Compresse l'image pour Gemini */
async function compressImg(file, maxPx, q) {
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * r); cv.height = Math.round(bmp.height * r);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(blob => {
    const rd = new FileReader();
    rd.onload = e => res({ b64: e.target.result.split(",")[1], mime: "image/jpeg" });
    rd.readAsDataURL(blob);
  }, "image/jpeg", q));
}
const compressForGemini = f => compressImg(f, 1280, 0.90);
const compressForPage   = f => compressImg(f, 2000, 0.88); // plus haute résolution pour 9 cartes

/* Fallback image : FR 404 → EN ; pas d'URL → fetch TCGdex EN */
const _enImgCache = {};
async function imgFb(el) {
  el.onerror = null;
  const s = el.src || "";
  if (s.includes("/fr/")) {
    // URL FR existe mais 404 → essaie EN
    el.onerror = () => { el.onerror = null; };
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // Pas d'URL FR du tout (data-set / data-local requis)
  const sid = el.dataset.set, lid = el.dataset.local;
  if (!sid || !lid) return;
  const key = `${sid}-${lid}`;
  if (!(key in _enImgCache)) {
    try {
      const r = await fetch(`https://api.tcgdex.net/v2/en/cards/${key}`);
      _enImgCache[key] = r.ok ? ((await r.json()).image || null) : null;
    } catch { _enImgCache[key] = null; }
  }
  if (_enImgCache[key]) el.src = _enImgCache[key] + "/low.webp";
}

const _logoCache = {};
async function logoFb(el) {
  el.onerror = null;
  const s = el.src || "";
  // 1. logo FR → logo EN
  if (s.includes("/fr/")) {
    el.onerror = () => logoFb(el);
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // 2. pokemontcg.io en priorité (couvre la plupart des sets avec un vrai logo)
  const sid = el.dataset.setid;
  if (sid && !el._ptcg) {
    el._ptcg = true;
    el.onerror = () => logoFb(el);
    el.src = `https://images.pokemontcg.io/${sid}/logo.png`;
    return;
  }
  // 3. → symbole de l'extension
  if (!el._sym && el.dataset.symbol) {
    el._sym = true;
    el.onerror = () => logoFb(el);
    el.src = el.dataset.symbol + ".webp";
    return;
  }
  // 4. symbole FR → symbole EN
  if (el._sym && !el._symEn && s.includes("/fr/")) {
    el._symEn = true;
    el.onerror = () => logoFb(el);
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // 5. première carte du set comme vignette (toujours disponible)
  if (sid && !el._card) {
    el._card = true;
    if (!_logoCache[sid]) {
      try {
        const r = await fetch(`https://api.tcgdex.net/v2/en/sets/${sid}`);
        _logoCache[sid] = r.ok ? ((await r.json()).cards?.[0]?.image || null) : null;
      } catch { _logoCache[sid] = null; }
    }
    if (_logoCache[sid]) {
      el.onerror = () => { el.onerror = null; el.replaceWith(Object.assign(document.createElement("span"), {textContent: el.alt})); };
      el.style.opacity = "0.65";
      el.src = _logoCache[sid] + "/low.webp";
      return;
    }
  }
  // 6. texte en dernier recours
  el.replaceWith(Object.assign(document.createElement("span"), {textContent: el.alt}));
}

/* Scan d'une page classeur entière (plusieurs cartes en une photo) */
async function scanPage(file) {
  S.scan = [];
  const entry = { status: "busy", found: [], _isPage: true };
  S.scan.unshift(entry); render();
  try {
    const { b64, mime } = await compressForPage(file);
    const resp = await fetch("/api/scan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: b64, mimeType: mime, mode: "page" })
    });
    let g;
    try { g = await resp.json(); } catch { g = { error: `HTTP ${resp.status}` }; }
    if (!resp.ok || g.error) {
      entry.status = "error"; entry.msg = `Gemini: ${g.error || "erreur"}`;
    } else {
      const cards = Array.isArray(g.cards) ? g.cards : [];
      entry.debug = `Page : ${cards.length} carte(s) détectée(s) — confirme ou retire`;
      // Résoudre chaque carte en parallèle (max 5 à la fois pour éviter le throttling)
      const resolve = async det => {
        let cands = det.number ? await lookupCard(det.number, det.total, det.setCode) : [];
        if (!cands.length) cands = await matchCard({...det, language: S.lang, variant: "normal"});
        return { det: {...det, language: S.lang, variant: "normal"}, cands, sel: 0, added: false };
      };
      const results = [];
      for (let i = 0; i < cards.length; i += 5) {
        const batch = await Promise.all(cards.slice(i, i + 5).map(resolve));
        results.push(...batch);
      }
      entry.found = results;
      entry.status = "done";
    }
  } catch(e) { entry.status = "error"; entry.msg = "analyse impossible (" + (e?.message || "erreur") + ")."; }
  render();
}

/* Import d'un fichier JSON généré (par Claude ou autre) */
async function importJson(data) {
  if (!Array.isArray(data)) { toast("Format JSON invalide — tableau attendu."); return; }
  const entry = { status: "busy", found: [], _isImport: true, debug: `Import : 0/${data.length}…` };
  S.scan.unshift(entry); render();
  let added = 0, skipped = 0;
  for (let i = 0; i < data.length; i++) {
    entry.debug = `Import : ${i + 1}/${data.length}…`; render();
    const item = data[i];
    const cardId = item.id || (item.setId && item.localId ? `${item.setId}-${item.localId}` : null);
    if (!cardId) { skipped++; continue; }
    try {
      let c = await j(`${API}/${S.lang}/cards/${encodeURIComponent(cardId)}`);
      if (!c?.id) c = await j(`${API}/en/cards/${encodeURIComponent(cardId)}`);
      if (!c?.id) { skipped++; continue; }
      const setId = c.id.slice(0, c.id.lastIndexOf("-"));
      const doc = S.coll[c.id] ? {...S.coll[c.id]} : {
        kind:"card", cardId:c.id, setId, name:c.name, localId:c.localId,
        image:c.image||"", rarity:c.rarity||"", v:{}, cond:"Near Mint",
        wish:false, addedAt:Date.now(), lang:S.lang.toUpperCase()
      };
      const variant = item.variant || "normal";
      const n = Math.max(1, parseInt(item.qty, 10) || 1);
      doc.v = {...doc.v, [variant]: (doc.v?.[variant] || 0) + n}; doc.wish = false;
      Store.save(doc); added++;
    } catch { skipped++; }
  }
  entry.status = "done";
  entry.debug = `Import terminé : ${added} ajoutée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}`;
  toast(`Import : ${added} carte(s) ajoutée(s).`);
  render();
}

async function scanFiles(files) {
  S.scan = [];
  for (const file of files) {
    const entry = { status: "busy", found: [] }; S.scan.unshift(entry); render();
    try {
      let name = "", number = "", total = "", setCode = "";
      let via = "Tesseract";

      // 1. Essaie Gemini via /api/scan
      let geminiDebug = "";
      try {
        const { b64, mime } = await compressForGemini(file);
        const resp = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: b64, mimeType: mime })
        });
        let g;
        try { g = await resp.json(); }
        catch { g = { error: `réponse non-JSON (HTTP ${resp.status})` }; }
        if (!resp.ok || g.error) {
          geminiDebug = `Gemini HTTP ${resp.status}: ${g.error||""} ${g.detail||""}`.trim();
        } else if (g.name || g.number) {
          name = g.name || ""; number = g.number || "";
          total = g.total || ""; setCode = g.setCode || "";
          via = "Gemini";
        } else {
          geminiDebug = "Gemini: aucun résultat";
        }
      } catch(e) { geminiDebug = "Gemini fetch échoué: " + e.message; }

      // 2. Fallback Tesseract si Gemini indisponible ou silencieux
      if (via === "Tesseract") {
        let worker;
        try { worker = await getOcrWorker(); }
        catch { toast("OCR non chargé — réessaie dans un instant."); entry.status = "error"; entry.msg = "OCR non chargé."; render(); continue; }

        const bmp = await createImageBitmap(file);
        const card = detectCard(bmp);
        const { x: cx, y: cy, w: cw, h: ch } = card;
        const ex = Math.round(cw * 0.08), ey = Math.round(ch * 0.08);
        const ex0 = Math.max(0, cx - ex), ey0 = Math.max(0, cy - ey);
        const ew = Math.min(bmp.width, cx + cw + ex) - ex0;
        const eh = Math.min(bmp.height, cy + ch + ey) - ey0;
        const nameCanvas = buildOcrCanvas(bmp, ex0 + Math.round(ew*0.05), ey0 + Math.round(eh*0.02), Math.round(ew*0.82), Math.round(eh*0.13), 3);
        const numCanvas  = buildOcrCanvas(bmp, ex0 + Math.round(ew*0.03), ey0 + Math.round(eh*0.78), Math.round(ew*0.94), Math.round(eh*0.20), 4);
        const nameText = await ocrCanvas(worker, nameCanvas, "7", "");
        const numText  = await ocrCanvas(worker, numCanvas, "11", "0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ");
        name = parseOcrName(nameText);
        ({ number, total, setCode } = parseOcrNumber(numText));
        const rawStr = `nom:"${nameText.replace(/\n/g,"↵").slice(0,20)}" n°:"${numText.replace(/\n/g,"↵").slice(0,25)}"`;
        entry.debug = `${geminiDebug ? geminiDebug + " → " : ""}${card._detected ? "Carte détectée" : "Image entière"} | Tesseract: ${rawStr}`;
      } else {
        entry.debug = `Gemini → ${[name, number&&(number+(total?"/"+total:"")), setCode].filter(Boolean).join(" ")}`;
      }

      let cands = number ? await lookupCard(number, total, setCode) : [];
      const det = { name, number, total, setCode, language: S.lang, variant: "normal" };
      if (!cands.length) cands = await matchCard(det);
      entry.found = [{ det, cands, sel: 0, added: false }];
      entry.status = "done";
    } catch(e) {
      entry.status = "error";
      entry.msg = "analyse impossible (" + (e?.message || "erreur") + ").";
    }
    render();
  }
}

const normNum = n => String(n ?? "").trim().toUpperCase().replace(/^0+(?=\d)/, "");
async function matchCard(det){
  const name = (det.name || "").trim(); if (!name) return [];
  const langs = [...new Set([det.language === "en" ? "en" : S.lang, S.lang, "en"])].filter(l => l === "fr" || l === "en");
  let pool = [];
  for (const l of langs) {
    for (const q of [name, name.replace(/\s+(ex|EX|GX|V|VMAX|VSTAR|V-UNION)$/,"")]) {
      try { const r = await j(`${API}/${l}/cards?name=${encodeURIComponent(q)}`); pool = (r||[]).map(c => ({...c, setId: c.id.slice(0, c.id.lastIndexOf("-"))})); } catch { pool = []; }
      if (pool.length) break;
    }
    if (pool.length) break;
  }
  const num = normNum(det.number), tot = parseInt(det.total, 10);
  const score = c => {
    let s = 0;
    if (normNum(c.localId) === num) s += 10;
    const set = S.catalog?.sets?.[c.setId];
    if (set && tot && (set.official === tot)) s += 6;
    if (c.name.toLowerCase() === name.toLowerCase()) s += 2;
    return s;
  };
  return pool.map(c => ({...c, _s: score(c)})).sort((a,b) => b._s - a._s);
}

/* Lookup direct par setId + localId (une seule requête, mis en cache) */
async function lookupInSet(setId, localId, lang){
  const normId = normNum(localId); if (!normId) return null;
  const cardId = `${setId}-${normId}`;
  const ck = `c:${lang}:${cardId}`;
  if (Object.prototype.hasOwnProperty.call(S.setCache, ck)) return S.setCache[ck];
  try {
    const c = await j(`${API}/${lang}/cards/${encodeURIComponent(cardId)}`);
    if (c?.id) return (S.setCache[ck] = {...c, setId});
  } catch {}
  // TCGdex stocke souvent les numéros à 3 chiffres (73 → 073)
  if (/^\d+$/.test(normId) && normId.length < 3) {
    const padded = normId.padStart(3, "0");
    const cardId2 = `${setId}-${padded}`;
    const ck2 = `c:${lang}:${cardId2}`;
    if (Object.prototype.hasOwnProperty.call(S.setCache, ck2)) return S.setCache[ck2];
    try {
      const c2 = await j(`${API}/${lang}/cards/${encodeURIComponent(cardId2)}`);
      return (S.setCache[ck2] = c2?.id ? {...c2, setId} : null);
    } catch {}
  }
  return (S.setCache[ck] = null);
}

/* Identification par numéro + total (+ hint code d'extension) */
async function lookupCard(number, total, codeHint){
  const norm = normNum(number); if (!norm) return [];
  const totalN = parseInt(total, 10);
  const hits = []; const tried = new Set();

  // 1. Code imprimé → setId direct (confidence max)
  const upCode = codeHint ? codeHint.toUpperCase() : "";
  const hintId = upCode ? (PRINT_CODE[upCode] || upCode.toLowerCase()) : null;
  if (hintId) {
    tried.add(hintId);
    const c = await lookupInSet(hintId, norm, S.lang) || await lookupInSet(hintId, norm, "en");
    if (c) return [{...c, _s: 20}]; // trouvé par code → pas besoin de balayer tout l'index
  }

  // 2. Index par total — toutes les extensions avec ce nb de cartes
  if (totalN > 0 && totalIdx.size) {
    const cands = totalIdx.get(totalN) || [];
    await Promise.all(cands.map(async sid => {
      if (tried.has(sid)) return; tried.add(sid);
      const c = await lookupInSet(sid, norm, S.lang) || await lookupInSet(sid, norm, "en");
      if (c) hits.push({...c, _s: 10});
    }));
  }

  return hits.sort((a,b) => b._s - a._s);
}
