async function analyzeForGrading(){
  // Toutes les cartes possédées non-gradées, triées par valeur décroissante
  const candidates = Object.values(S.coll)
    .filter(d => qty(d) && !d.grade?.co)
    .map(d => ({ cardId:d.cardId, name:d.name, setId:d.setId, value: cardValue(d)||0, image:d.image||"" }))
    .sort((a,b) => b.value - a.value)
    .slice(0, 50);
  if (!candidates.length) {
    S.gradeReco = { error: "Aucune carte non-gradée dans ta collection." };
    render(); return;
  }
  // Map cardId → candidate pour retrouver image/valeur après la réponse Gemini
  const cardMap = Object.fromEntries(candidates.map(c => [c.cardId, c]));
  S.gradeReco = { loading: true }; render();
  try {
    const res = await fetch("/api/grade-analysis", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards: candidates, preferredGrader: S.profile.preferredGrader || "PSA" })
    });
    const data = await res.json();
    if (!res.ok) { S.gradeReco = { error: data.error || "Erreur serveur", detail: data.detail || "" }; }
    else {
      const items = (data.recommendations || []).map(r => {
        const orig = cardMap[r.cardId] || candidates.find(c => normStr(c.name) === normStr(r.name));
        return { ...r, cardId: orig?.cardId || r.cardId || "", image: orig?.image || "", value: orig?.value || 0 };
      }).filter(r => r.cardId);
      S.gradeReco = { items };
    }
  } catch(e) { S.gradeReco = { error: e.message || "Réseau indisponible" }; }
  render();
}

async function getBuyingAdvice(){
  const allSets = Object.values(S.catalog?.sets || {})
    .map(set => {
      const owned = Object.values(S.coll).filter(d => d.setId === set.id && qty(d)).length;
      const total = set.official || set.total || 0;
      return { name: set.name, setId: set.id, owned, total, pct: total ? Math.round(owned/total*100) : 0 };
    })
    .filter(s => s.owned > 0 && s.pct < 100 && s.total > 0)
    .sort((a,b) => b.owned - a.owned)
    .slice(0, 25);
  const wished = Object.values(S.coll).filter(d => d.wish && !qty(d))
    .map(d => ({ name: d.name, setId: d.setId, localId: d.localId, cardId: d.cardId })).slice(0, 30);
  if (!allSets.length) {
    S.buyAdvice = { error: "Scan des cartes pour construire ta collection d'abord." };
    render(); return;
  }
  S.buyAdvice = { loading: true }; render();
  try {
    // Récupère les cartes manquantes des 8 sets les plus avancés
    const topSets = allSets.slice(0, 8);
    const setsWithMissing = await Promise.all(topSets.map(async s => {
      try {
        const data = await j(`${API}/${S.lang}/sets/${s.setId}`);
        const ownedLocalIds = new Set(Object.values(S.coll).filter(d => d.setId === s.setId && qty(d)).map(d => d.localId));
        const missing = (data?.cards || [])
          .filter(c => !ownedLocalIds.has(c.localId))
          .map(c => ({ name: c.name, localId: c.localId, rarity: c.rarity || "" }))
          .slice(0, 25);
        return { ...s, missing };
      } catch { return { ...s, missing: [] }; }
    }));
    const res = await fetch("/api/buy-advice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sets: setsWithMissing, wished, lang: S.lang })
    });
    const data = await res.json();
    if (!res.ok) { S.buyAdvice = { error: data.error || "Erreur serveur", detail: data.detail || "" }; }
    else { S.buyAdvice = { items: data.recommendations || [] }; }
  } catch(e) { S.buyAdvice = { error: e.message || "Réseau indisponible" }; }
  render();
}

      grade: (() => { const gs = $("#f-gstatus",scrim)?.value||"", gc = gs ? ($("#f-gco",scrim)?.value||"") : ""; if (!gs||!gc) return null; if (gs==="pending") return {status:"pending",co:gc,sentAt:$("#f-gsentat",scrim)?.value||""}; return {status:"done",co:gc,note:$("#f-gnote",scrim)?.value?.trim()||"",value:$("#f-gval",scrim)?.value===""?null:+$("#f-gval",scrim)?.value}; })(),

    if (!doc.addedAt && qty(doc)) doc.addedAt = Date.now();
    if (qty(doc) || doc.wish) Store.save(doc); else if (S.coll[id]) Store.remove(id);
  };
  // Navigation dans la série
  const idx = deck.indexOf(id);
  const prevId = idx > 0 ? deck[idx-1] : null;
  const nextId = idx >= 0 && idx < deck.length-1 ? deck[idx+1] : null;
  const hasnav = deck.length > 1 && (prevId || nextId);
  const W = () => window.innerWidth;

  // Fermeture animée (glisse vers le bas)
  const slideClose = (fromDrag=false) => {
    if (_onKey) document.removeEventListener("keydown", _onKey);
    const sh = scrim.querySelector(".sheet");
    sh.style.transition = `transform ${fromDrag?'0.2s':'0.28s'} cubic-bezier(0.55,0,1,0.45), opacity 0.2s`;
    sh.style.transform = `translateY(${window.innerHeight}px)`;
    sh.style.opacity = '0';
    setTimeout(() => { scrim.remove(); render(); }, fromDrag ? 210 : 290);
  };

  const goTo = (nid, outDir, fromDrag=false) => {
    commit();
    if (_onKey) document.removeEventListener("keydown", _onKey);
    const sh = scrim.querySelector(".sheet");
    const dur = fromDrag ? 0.15 : 0.22;
    sh.style.transition = `transform ${dur}s cubic-bezier(0.55,0,1,0.45), opacity ${dur}s`;
    sh.style.transform = `translateX(${outDir === 'left' ? -W()*1.1 : W()*1.1}px)`;
    sh.style.opacity = '0';
    openCard(nid, deck, outDir === 'left' ? 'right' : 'left');
    setTimeout(() => scrim.remove(), dur*1000 + 10);
  };
  _onKey = e => {
    if (e.key === "ArrowLeft"  && prevId) { e.preventDefault(); goTo(prevId, 'right'); }
    else if (e.key === "ArrowRight" && nextId) { e.preventDefault(); goTo(nextId, 'left'); }
    else if (e.key === "Escape") slideClose();
  };
  if (hasnav) document.addEventListener("keydown", _onKey);

  paint();

  scrim.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.inc || t.dataset.dec) { const k = t.dataset.inc || t.dataset.dec; doc.v = {...doc.v, [k]: Math.max(0, (doc.v?.[k]||0) + (t.dataset.inc ? 1 : -1))}; commit(); paint(); }
    else if (t.id === "wishbtn") { doc.wish = !doc.wish; commit(); paint(); }
    else if (t.id === "delbtn") { Store.remove(id); slideClose(); toast("Retirée"); }
    else if (t.id === "okbtn" || t.id === "closebtn") { commit(); slideClose(); }
  });
  scrim.addEventListener("change", e => {
    if (e.target.id === "f-gstatus") {
      const v = e.target.value;
      const fw = id => $("#" + id, scrim);
      if (fw("fw-gco"))   fw("fw-gco").style.display   = v ? "" : "none";
      if (fw("fw-gpend")) fw("fw-gpend").style.display = v==="pending" ? "" : "none";
      if (fw("fw-gdone")) fw("fw-gdone").style.display = v==="done" ? "" : "none";
    }
    commit();
  });

  // Swipe physique : suit le doigt (horizontal = navigation, bas = fermer)
  const sheet = scrim.querySelector(".sheet");
  let _tx0 = 0, _ty0 = 0, _tScroll = 0, _dragging = false, _dragDir = null;
  sheet.addEventListener("touchstart", e => {
    _tx0 = e.touches[0].clientX; _ty0 = e.touches[0].clientY;
    _tScroll = sheet.scrollTop; _dragging = false; _dragDir = null;
    sheet.style.transition = 'none';
  }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    const dx = e.touches[0].clientX - _tx0;
    const dy = e.touches[0].clientY - _ty0;
    if (!_dragDir) {
      if (dy > 0 && dy > Math.abs(dx) + 4 && _tScroll === 0) { _dragDir = 'v'; _dragging = true; }
      else if (Math.abs(dx) > 8 && hasnav) { _dragDir = 'h'; _dragging = true; }
      else return;
    }
    e.preventDefault();
    if (_dragDir === 'h') {
      const resist = dx > 0 ? (prevId ? 1 : 0.1) : (nextId ? 1 : 0.1);
      sheet.style.transform = `translateX(${dx * resist}px)`;
      sheet.style.opacity = String(Math.max(0.7, 1 - Math.abs(dx) / W() * 0.6));
    } else {
      const drag = Math.max(0, dy);
      sheet.style.transform = `translateY(${drag}px)`;
      sheet.style.opacity = String(Math.max(0.5, 1 - drag / 350));
    }
  }, {passive:false});
  sheet.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - _tx0;
    const dy = e.changedTouches[0].clientY - _ty0;
    sheet.style.opacity = '';
    if (_dragDir === 'h') {
      const threshold = Math.min(110, W() * 0.3);
      if (dx >  threshold && prevId) { goTo(prevId, 'right', true); return; }
      if (dx < -threshold && nextId) { goTo(nextId, 'left',  true); return; }
      sheet.style.transition = 'transform 0.38s cubic-bezier(0.34,1.56,0.64,1)';
      sheet.style.transform = 'translateX(0)';
    } else if (_dragDir === 'v') {
      if (dy > 130) { slideClose(true); return; }
      sheet.style.transition = 'transform 0.38s cubic-bezier(0.34,1.56,0.64,1)';
      sheet.style.transform = 'translateY(0)';
    }
    _dragging = false; _dragDir = null;
  });
}

let _ocrWorker = null;
async function getOcrWorker() {
  if (_ocrWorker) return _ocrWorker;
  if (!window.Tesseract) throw new Error("Tesseract.js non disponible");
  const _o = location.origin;
  _ocrWorker = await Tesseract.createWorker("eng", 1, {
    workerPath:    _o + "/tesseract/worker.min.js",
    corePath:      _o + "/tesseract/tesseract-core-lstm.wasm.js",
    langPath:      _o + "/tesseract/lang/",
    workerBlobURL: false,
    logger: () => {},
  });
  return _ocrWorker;
}

/* Détecte le rectangle de la carte par projection de gradient Sobel.
   Les bords de la carte créent des pics nets dans la projection ; fonctionne
   aussi bien pour une photo directe que pour une capture d'écran eBay/shop.
   Retourne {x,y,w,h} dans les coords originales, ou l'image entière en fallback. */
function detectCard(bmp) {
  const MAX = 500;
  const ratio = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const sw = Math.round(bmp.width * ratio), sh = Math.round(bmp.height * ratio);
  const tmp = document.createElement("canvas");
  tmp.width = sw; tmp.height = sh;
  const tctx = tmp.getContext("2d");
  tctx.drawImage(bmp, 0, 0, sw, sh);
  const px = tctx.getImageData(0, 0, sw, sh).data;

  const gv = new Uint8Array(sw * sh);
  for (let i = 0; i < gv.length; i++)
    gv[i] = (77*px[i*4] + 150*px[i*4+1] + 29*px[i*4+2]) >> 8;

  // Projection du gradient : somme du module Sobel par ligne / colonne
  const rp = new Float32Array(sh), cp = new Float32Array(sw);
  for (let y = 1; y < sh - 1; y++)
    for (let x = 1; x < sw - 1; x++) {
      const gx = gv[y*sw+x+1] - gv[y*sw+x-1];
      const gy = gv[(y+1)*sw+x] - gv[(y-1)*sw+x];
      const m = Math.sqrt(gx*gx + gy*gy);
      rp[y] += m; cp[x] += m;
    }

  // Lissage ±5 px pour réduire le bruit
  const smooth = (a, r) => {
    const b = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) {
      let s = 0, n = 0;
      for (let j = Math.max(0,i-r); j <= Math.min(a.length-1,i+r); j++,n++) s += a[j];
      b[i] = s / n;
    }
    return b;
  };
  const srp = smooth(rp, 5), scp = smooth(cp, 5);

  // Premier et dernier pic local au-dessus de 15 % du max
  // (les transitions fond↔carte créent les pics extrêmes les plus forts)
  const outerPeaks = (a, minH) => {
    let first = -1, last = -1;
    for (let i = 1; i < a.length - 1; i++) {
      if (a[i] > a[i-1] && a[i] > a[i+1] && a[i] > minH) {
        if (first < 0) first = i;
        last = i;
      }
    }
    return [first < 0 ? 0 : first, last < 0 ? a.length-1 : last];
  };

  let maxR = 0, maxC = 0;
  for (let i = 0; i < srp.length; i++) if (srp[i] > maxR) maxR = srp[i];
  for (let i = 0; i < scp.length; i++) if (scp[i] > maxC) maxC = scp[i];

  const [top, bot] = outerPeaks(srp, maxR * 0.15);
  const [lft, rgt] = outerPeaks(scp, maxC * 0.15);

  // Sanité : couvre au moins 30 % de chaque dimension
  if ((rgt - lft) < sw * 0.30 || (bot - top) < sh * 0.30)
    return { x: 0, y: 0, w: bmp.width, h: bmp.height, _detected: false };

  const pad = Math.round(8 / ratio);
  const ox = Math.max(0, Math.round(lft / ratio) - pad);
  const oy = Math.max(0, Math.round(top / ratio) - pad);
  const or = Math.min(bmp.width,  Math.round(rgt / ratio) + pad);
  const ob = Math.min(bmp.height, Math.round(bot / ratio) + pad);
  return { x: ox, y: oy, w: or - ox, h: ob - oy, _detected: true };
}

function buildOcrCanvas(bmp, rx, ry, rw, rh, scale = 3) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(rw * scale); cv.height = Math.round(rh * scale);
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bmp, rx, ry, rw, rh, 0, 0, cv.width, cv.height);
  const id = ctx.getImageData(0, 0, cv.width, cv.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
    const c = g < 140 ? Math.max(0, g - 40) : Math.min(255, g + 40);
    d[i] = d[i+1] = d[i+2] = c;
  }
  ctx.putImageData(id, 0, 0);
  return cv;
}

async function ocrCanvas(worker, canvas, psm, whitelist = "") {
  await worker.setParameters({ tessedit_pageseg_mode: psm, tessedit_char_whitelist: whitelist });
  const { data: { text } } = await worker.recognize(canvas);
  return text.trim();
}

function parseOcrNumber(txt) {
  const m = txt.match(/(\d{1,4})\s*[\/|\\]\s*(\d{1,4})/) ||
            txt.match(/([A-Z]{1,4}\d{1,4})\s*[\/|\\]\s*(\d{1,4})/) ||
            txt.match(/([A-Z]{2,5}\d{2,4})/);
  if (!m) return { number: "", total: "", setCode: "" };
  const number = m[1].replace(/O/g, "0").replace(/l/g, "1").replace(/I/g, "1");
  const total = (m[2] || "").replace(/O/g, "0");
  // Cherche un code d'extension connu dans le texte OCR (ex: SVI, PAL, 30C…)
  const upper = txt.toUpperCase();
  let setCode = Object.keys(PRINT_CODE).find(c => upper.includes(c)) || "";
  if (!setCode) {
    const skip = new Set(["GAME","FREAK","POKE","EMON","ILLUS","TAILLE","POIDS","OKAY"]);
    setCode = (txt.match(/\b([A-Z]{2,5})\b/g) || []).find(c => !skip.has(c)) || "";
  }
  return { number, total, setCode };
}

function parseOcrName(txt) {
  return txt
    .split("\n")[0]
    .replace(/\s*HP\s*\d+/i, "")
    .replace(/[^\p{L}\p{N}\s\-'\.]/gu, " ")
    .replace(/\s+/g, " ")
    .trim()
    // Retire un préfixe parasite de 1-2 chars suivi d'une majuscule (ex: "Il Pikachu")
    // sauf abréviations connues dans les noms Pokémon : Mr, Lt
    .replace(/^(?!Mr\s|Lt\s)[A-Za-z]{1,2}\s+(?=[A-ZÀÁÂÄÆÇÈÉÊËÎÏÔÙÚÛÜ])/u, "")
    // Retire les chiffres parasites en fin de nom (ex: "Pikachu 704")
    .replace(/\s+\d+$/, "")
    .slice(0, 50);
}

/* Compresse l'image pour Gemini */
async function compressImg(file, maxPx, q) {
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * r); cv.height = Math.round(bmp.height * r);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(blob => {
    const rd = new FileReader();
    rd.onload = e => res({ b64: e.target.result.split(",")[1], mime: "image/jpeg" });
    rd.readAsDataURL(blob);
  }, "image/jpeg", q));
}
const compressForGemini = f => compressImg(f, 1280, 0.90);
const compressForPage   = f => compressImg(f, 2000, 0.88); // plus haute résolution pour 9 cartes

/* Fallback image : FR 404 → EN ; pas d'URL → fetch TCGdex EN */
const _enImgCache = {};
async function imgFb(el) {
  el.onerror = null;
  const s = el.src || "";
  if (s.includes("/fr/")) {
    // URL FR existe mais 404 → essaie EN
    el.onerror = () => { el.onerror = null; };
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // Pas d'URL FR du tout (data-set / data-local requis)
  const sid = el.dataset.set, lid = el.dataset.local;
  if (!sid || !lid) return;
  const key = `${sid}-${lid}`;
  if (!(key in _enImgCache)) {
    try {
      const r = await fetch(`https://api.tcgdex.net/v2/en/cards/${key}`);
      _enImgCache[key] = r.ok ? ((await r.json()).image || null) : null;
    } catch { _enImgCache[key] = null; }
  }
  if (_enImgCache[key]) el.src = _enImgCache[key] + "/low.webp";
}

const _logoCache = {};
async function logoFb(el) {
  el.onerror = null;
  const s = el.src || "";
  // 1. logo FR → logo EN
  if (s.includes("/fr/")) {
    el.onerror = () => logoFb(el);
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // 2. pokemontcg.io en priorité (couvre la plupart des sets avec un vrai logo)
  const sid = el.dataset.setid;
  if (sid && !el._ptcg) {
    el._ptcg = true;
    el.onerror = () => logoFb(el);
    el.src = `https://images.pokemontcg.io/${sid}/logo.png`;
    return;
  }
  // 3. → symbole de l'extension
  if (!el._sym && el.dataset.symbol) {
    el._sym = true;
    el.onerror = () => logoFb(el);
    el.src = el.dataset.symbol + ".webp";
    return;
  }
  // 4. symbole FR → symbole EN
  if (el._sym && !el._symEn && s.includes("/fr/")) {
    el._symEn = true;
    el.onerror = () => logoFb(el);
    el.src = s.replace("/fr/", "/en/");
    return;
  }
  // 5. première carte du set comme vignette (toujours disponible)
  if (sid && !el._card) {
    el._card = true;
    if (!_logoCache[sid]) {
      try {
        const r = await fetch(`https://api.tcgdex.net/v2/en/sets/${sid}`);
        _logoCache[sid] = r.ok ? ((await r.json()).cards?.[0]?.image || null) : null;
      } catch { _logoCache[sid] = null; }
    }
    if (_logoCache[sid]) {
      el.onerror = () => { el.onerror = null; el.replaceWith(Object.assign(document.createElement("span"), {textContent: el.alt})); };
      el.style.opacity = "0.65";
      el.src = _logoCache[sid] + "/low.webp";
      return;
    }
  }
  // 6. texte en dernier recours
  el.replaceWith(Object.assign(document.createElement("span"), {textContent: el.alt}));
}

/* Scan d'une page classeur entière (plusieurs cartes en une photo) */
async function scanPage(file) {
  S.scan = [];
  const entry = { status: "busy", found: [], _isPage: true };
  S.scan.unshift(entry); render();
  try {
    const { b64, mime } = await compressForPage(file);
    const resp = await fetch("/api/scan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: b64, mimeType: mime, mode: "page" })
    });
    let g;
    try { g = await resp.json(); } catch { g = { error: `HTTP ${resp.status}` }; }
    if (!resp.ok || g.error) {
      entry.status = "error"; entry.msg = `Gemini: ${g.error || "erreur"}`;
    } else {
      const cards = Array.isArray(g.cards) ? g.cards : [];
      entry.debug = `Page : ${cards.length} carte(s) détectée(s) — confirme ou retire`;
      // Résoudre chaque carte en parallèle (max 5 à la fois pour éviter le throttling)
      const resolve = async det => {
        // Priorité au nom : matchCard cherche par nom et classe par numéro
        let cands = det.name ? await matchCard({...det, language: S.lang, variant: "normal"}) : [];
        // Filtre par numéro si on l'a (garde que nom+numéro correspondants)
        if (cands.length && det.number) { const nn=normNum(det.number); const f=cands.filter(c=>normNum(c.localId)===nn); if(f.length) cands=f; }
        // Fallback par numéro uniquement si la recherche par nom n'a rien donné
        if (!cands.length && det.number) cands = filterCandsByName(await lookupCard(det.number, det.total, det.setCode), det.name);
        return { det: {...det, language: S.lang, variant: "normal"}, cands, sel: 0, added: false };
      };
      const results = [];
      for (let i = 0; i < cards.length; i += 5) {
        const batch = await Promise.all(cards.slice(i, i + 5).map(resolve));
        results.push(...batch);
      }
      entry.found = results;
      entry.status = "done";
    }
  } catch(e) { entry.status = "error"; entry.msg = "analyse impossible (" + (e?.message || "erreur") + ")."; }
  render();
}

/* Import d'un fichier JSON généré (par Claude ou autre) */
async function importJson(data) {
  if (!Array.isArray(data)) { toast("Format JSON invalide — tableau attendu."); return; }
  const entry = { status: "busy", found: [], _isImport: true, debug: `Import : 0/${data.length}…` };
  S.scan.unshift(entry); render();
  let added = 0, skipped = 0;
  for (let i = 0; i < data.length; i++) {
    entry.debug = `Import : ${i + 1}/${data.length}…`; render();
    const item = data[i];
    const cardId = item.id || (item.setId && item.localId ? `${item.setId}-${item.localId}` : null);
    if (!cardId) { skipped++; continue; }
    try {
      let c = await j(`${API}/${S.lang}/cards/${encodeURIComponent(cardId)}`);
      if (!c?.id) c = await j(`${API}/en/cards/${encodeURIComponent(cardId)}`);
      if (!c?.id) { skipped++; continue; }
      const setId = c.id.slice(0, c.id.lastIndexOf("-"));
      const doc = S.coll[c.id] ? {...S.coll[c.id]} : {
        kind:"card", cardId:c.id, setId, name:c.name, localId:c.localId,
        image:c.image||"", rarity:c.rarity||"", v:{}, cond:"Near Mint",
        wish:false, addedAt:Date.now(), lang:S.lang.toUpperCase()
      };
      const variant = item.variant || "normal";
      const n = Math.max(1, parseInt(item.qty, 10) || 1);
      doc.v = {...doc.v, [variant]: (doc.v?.[variant] || 0) + n}; doc.wish = false;
      Store.save(doc); added++;
    } catch { skipped++; }
  }
  entry.status = "done";
  entry.debug = `Import terminé : ${added} ajoutée(s)${skipped ? `, ${skipped} ignorée(s)` : ""}`;
  toast(`Import : ${added} carte(s) ajoutée(s).`);
  render();
}

async function scanFiles(files) {
  S.scan = [];
  for (const file of files) {
    const entry = { status: "busy", found: [] }; S.scan.unshift(entry); render();
    try {
      let name = "", number = "", total = "", setCode = "";
      let via = "Tesseract";

      // 1. Essaie Gemini via /api/scan
      let geminiDebug = "";
      try {
        const { b64, mime } = await compressForGemini(file);
        const resp = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imageBase64: b64, mimeType: mime })
        });
        let g;
        try { g = await resp.json(); }
        catch { g = { error: `réponse non-JSON (HTTP ${resp.status})` }; }
        if (!resp.ok || g.error) {
          geminiDebug = `Gemini HTTP ${resp.status}: ${g.error||""} ${g.detail||""}`.trim();
        } else if (g.name || g.number) {
          name = g.name || ""; number = g.number || "";
          total = g.total || ""; setCode = g.setCode || "";
          via = "Gemini";
        } else {
          geminiDebug = "Gemini: aucun résultat";
        }
      } catch(e) { geminiDebug = "Gemini fetch échoué: " + e.message; }

      // 2. Fallback Tesseract si Gemini indisponible ou silencieux
      if (via === "Tesseract") {
        let worker;
        try { worker = await getOcrWorker(); }
        catch { toast("OCR non chargé — réessaie dans un instant."); entry.status = "error"; entry.msg = "OCR non chargé."; render(); continue; }

        const bmp = await createImageBitmap(file);
        const card = detectCard(bmp);
        const { x: cx, y: cy, w: cw, h: ch } = card;
        const ex = Math.round(cw * 0.08), ey = Math.round(ch * 0.08);
        const ex0 = Math.max(0, cx - ex), ey0 = Math.max(0, cy - ey);
        const ew = Math.min(bmp.width, cx + cw + ex) - ex0;
        const eh = Math.min(bmp.height, cy + ch + ey) - ey0;
        const nameCanvas = buildOcrCanvas(bmp, ex0 + Math.round(ew*0.05), ey0 + Math.round(eh*0.02), Math.round(ew*0.82), Math.round(eh*0.13), 3);
        const numCanvas  = buildOcrCanvas(bmp, ex0 + Math.round(ew*0.03), ey0 + Math.round(eh*0.78), Math.round(ew*0.94), Math.round(eh*0.20), 4);
        const nameText = await ocrCanvas(worker, nameCanvas, "7", "");
        const numText  = await ocrCanvas(worker, numCanvas, "11", "0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ");
        name = parseOcrName(nameText);
        ({ number, total, setCode } = parseOcrNumber(numText));
        const rawStr = `nom:"${nameText.replace(/\n/g,"↵").slice(0,20)}" n°:"${numText.replace(/\n/g,"↵").slice(0,25)}"`;
        entry.debug = `${geminiDebug ? geminiDebug + " → " : ""}${card._detected ? "Carte détectée" : "Image entière"} | Tesseract: ${rawStr}`;
      } else {
        entry.debug = `Gemini → ${[name, number&&(number+(total?"/"+total:"")), setCode].filter(Boolean).join(" ")}`;
      }

      const det = { name, number, total, setCode, language: S.lang, variant: "normal" };
      // Priorité au nom : matchCard cherche par nom et classe par numéro
      let cands = name ? await matchCard(det) : [];
      // Filtre par numéro si on l'a (garde que nom+numéro correspondants)
      if (cands.length && number) { const nn=normNum(number); const f=cands.filter(c=>normNum(c.localId)===nn); if(f.length) cands=f; }
      // Fallback par numéro si la recherche par nom échoue
      if (!cands.length && number) cands = filterCandsByName(await lookupCard(number, total, setCode), name);
      entry.found = [{ det, cands, sel: 0, added: false }];
      entry.status = "done";
    } catch(e) {
      entry.status = "error";
      entry.msg = "analyse impossible (" + (e?.message || "erreur") + ").";
    }
    render();
  }
}

const normNum = n => String(n ?? "").trim().toUpperCase().replace(/^0+(?=\d)/, "");
/* Garde seulement les candidats dont le nom correspond — fallback sur tout si aucun match */
function filterCandsByName(cands, name){
  if (!name || !cands.length) return cands;
  const n = normStr(name);
  const exact = cands.filter(c => normStr(c.name) === n);
  if (exact.length) return exact;
  // Essai partiel (ex. "Dracaufeu" contenu dans "Dracaufeu-ex")
  const partial = cands.filter(c => normStr(c.name).includes(n) || n.includes(normStr(c.name)));
  return partial.length ? partial : cands;
}
async function matchCard(det){
  const name = (det.name || "").trim(); if (!name) return [];
  const langs = [...new Set([det.language === "en" ? "en" : S.lang, S.lang, "en"])].filter(l => l === "fr" || l === "en");
  let pool = [];
  for (const l of langs) {
    for (const q of [name, name.replace(/\s+(ex|EX|GX|V|VMAX|VSTAR|V-UNION)$/,"")]) {
      try { const r = await j(`${API}/${l}/cards?name=${encodeURIComponent(q)}`); pool = (r||[]).map(c => ({...c, setId: c.id.slice(0, c.id.lastIndexOf("-"))})); } catch { pool = []; }
      if (pool.length) break;
    }
    if (pool.length) break;
  }
  const num = normNum(det.number), tot = parseInt(det.total, 10);
  const score = c => {
    let s = 0;
    if (normNum(c.localId) === num) s += 10;
    const set = S.catalog?.sets?.[c.setId];
    if (set && tot && (set.official === tot)) s += 6;
    if (c.name.toLowerCase() === name.toLowerCase()) s += 2;
    return s;
  };
  return pool.map(c => ({...c, _s: score(c)})).sort((a,b) => b._s - a._s);
}

/* Lookup direct par setId + localId (une seule requête, mis en cache) */
async function lookupInSet(setId, localId, lang){
  const normId = normNum(localId); if (!normId) return null;
  const cardId = `${setId}-${normId}`;
  const ck = `c:${lang}:${cardId}`;
  if (Object.prototype.hasOwnProperty.call(S.setCache, ck)) return S.setCache[ck];
  try {
    const c = await j(`${API}/${lang}/cards/${encodeURIComponent(cardId)}`);
    if (c?.id) return (S.setCache[ck] = {...c, setId});
  } catch {}
  // TCGdex stocke souvent les numéros à 3 chiffres (73 → 073)
  if (/^\d+$/.test(normId) && normId.length < 3) {
    const padded = normId.padStart(3, "0");
    const cardId2 = `${setId}-${padded}`;
    const ck2 = `c:${lang}:${cardId2}`;
    if (Object.prototype.hasOwnProperty.call(S.setCache, ck2)) return S.setCache[ck2];
    try {
      const c2 = await j(`${API}/${lang}/cards/${encodeURIComponent(cardId2)}`);
      return (S.setCache[ck2] = c2?.id ? {...c2, setId} : null);
    } catch {}
  }
  return (S.setCache[ck] = null);
}

/* Identification par numéro + total (+ hint code d'extension) */
async function lookupCard(number, total, codeHint){
  const norm = normNum(number); if (!norm) return [];
  const totalN = parseInt(total, 10);
  const hits = []; const tried = new Set();

  // 1. Code imprimé → setId direct (confidence max)
  const upCode = codeHint ? codeHint.toUpperCase() : "";
  const hintId = upCode ? (PRINT_CODE[upCode] || upCode.toLowerCase()) : null;
  if (hintId) {
    tried.add(hintId);
    const c = await lookupInSet(hintId, norm, S.lang) || await lookupInSet(hintId, norm, "en");
    if (c) return [{...c, _s: 20}]; // trouvé par code → pas besoin de balayer tout l'index
  }

  // 2. Index par total — toutes les extensions avec ce nb de cartes
  if (totalN > 0 && totalIdx.size) {
    const cands = totalIdx.get(totalN) || [];
    await Promise.all(cands.map(async sid => {
      if (tried.has(sid)) return; tried.add(sid);
      const c = await lookupInSet(sid, norm, S.lang) || await lookupInSet(sid, norm, "en");
      if (c) hits.push({...c, _s: 10});
    }));
  }

  return hits.sort((a,b) => b._s - a._s);
}

/* ---------- scanner vidéo ---------- */
const VS = { stream:null, overlay:null, timer:null, magRaf:null, textDet:null, buffer:[], busy:false, currentCands:null, currentSel:0, currentVariant:"normal" };

async function startVideoScan(){
  if (VS.overlay) return;
  if (!totalIdx.size && S.catalog) buildTotalIndex();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    // Force zoom=1 pour éviter le basculement sur la caméra macro d'iPhone
    const vtrack = stream.getVideoTracks()[0];

      <div id="vscan-top"><button class="btn" style="background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:14px" data-vscan="close">✕ Fermer</button></div>
    </div>
    <canvas id="vscan-mag" title="Zone numéro agrandie"></canvas>
    <div id="vscan-bottom">
      <div id="vscan-inputrow">
        <input id="vscan-q" class="search" type="search" placeholder="Numéro (136/189) ou nom de la carte…" autocomplete="off" inputmode="search" enterkeyhint="search">
        <button class="btn" id="vscan-photo-btn" title="Capturer ce cadre" style="flex-shrink:0;font-size:20px;padding:0 10px">📷</button>
        <button class="btn" id="vscan-gallery-btn" title="Depuis la galerie" style="flex-shrink:0;font-size:20px;padding:0 10px">🖼</button>
      </div>
      <div id="vscan-results"><p class="muted" style="font-size:13px;margin:0">Lis le numéro dans la loupe ci-dessus et tape-le — ou appuie sur 📷 pour tenter la reconnaissance.</p></div>
      <div id="vscan-confirm" hidden>
        <div class="chips" role="group" id="vscan-vars">${VARIANTS.map(([v,l])=>`<button class="chip" data-vsvar="${v}" aria-pressed="${v==="normal"}">${l}</button>`).join("")}</div>
        <div class="row" style="gap:8px">
          <button class="btn primary" style="flex:1" data-vscan="add">Ajouter au classeur</button>
          <button class="btn" data-vscan="clearsel">Annuler</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const vid = ov.querySelector("#vscan-vid"); vid.srcObject = stream;
  Object.assign(VS, {stream, overlay:ov, buffer:[], busy:false, currentCands:null, currentSel:0, currentVariant:"normal"});

  const inp = ov.querySelector("#vscan-q");
  let searchTm;
  inp.addEventListener("input", () => {
    clearTimeout(searchTm);
    const q = inp.value.trim();
    if (!q){ document.getElementById("vscan-results").innerHTML=`<p class="muted" style="font-size:13px;margin:0">Tape un numéro (136/189) ou un nom.</p>`; document.getElementById("vscan-confirm").hidden=true; return; }
    if (q.length >= 2) searchTm = setTimeout(() => vscanSearch(q), 380);
  });
  inp.addEventListener("keydown", e => { if (e.key==="Enter"){ clearTimeout(searchTm); vscanSearch(inp.value.trim()); } });

  ov.querySelector("#vscan-photo-btn").addEventListener("click", vscanCapturePhoto);
  ov.querySelector("#vscan-gallery-btn").addEventListener("click", () => { $("#photo-gallery").click(); stopVideoScan(); });

  ov.addEventListener("click", e => {
    const b = e.target.closest("[data-vscan],[data-vscard],[data-vsvar]"); if (!b) return;
    if (b.dataset.vscan === "close") { stopVideoScan(); return; }
    if (b.dataset.vscan === "add") { vscanAdd(); return; }
    if (b.dataset.vscan === "clearsel") {
      VS.currentCands = null; document.getElementById("vscan-confirm").hidden = true;
      ov.querySelectorAll("[data-vscard]").forEach(x => x.setAttribute("aria-pressed","false")); return;
    }
    if (b.dataset.vscard != null) {
      VS.currentSel = +b.dataset.vscard;
      if (window._vsAutoAdd) { clearInterval(window._vsAutoAdd); window._vsAutoAdd = null; }
      const rd = document.getElementById("vscan-results");
      if (VS.currentCands?.[VS.currentSel]) _vscanDoAdd(VS.currentCands[VS.currentSel], rd);
      return;
    }
    if (b.dataset.vsvar) {
      VS.currentVariant = b.dataset.vsvar;
      ov.querySelectorAll("[data-vsvar]").forEach(x => x.setAttribute("aria-pressed", x.dataset.vsvar === VS.currentVariant));
    }
  });

  // Loupe temps réel : affiche la zone numéro agrandie
  const mag = ov.querySelector("#vscan-mag");
  function updateMag(){
    const v = document.getElementById("vscan-vid");
    if (v && v.readyState >= 2 && v.videoWidth){
      const W = v.videoWidth, H = v.videoHeight;
      mag.width = mag.clientWidth || 300; mag.height = 54;
      mag.getContext("2d").drawImage(v, Math.round(W*0.05), Math.round(H*0.76), Math.round(W*0.90), Math.round(H*0.20), 0, 0, mag.width, mag.height);
    }
    if (VS.overlay) VS.magRaf = requestAnimationFrame(updateMag);
  }
  VS.magRaf = requestAnimationFrame(updateMag);

  // Lancement de la détection automatique
  if ('TextDetector' in window) {
    vscanBadge("Détection texte active");
    VS.textDet = new TextDetector();
  } else {
    if (window.Tesseract) { vscanBadge("Chargement OCR…"); getOcrWorker().then(() => vscanBadge("Loupe active — tape ou 📷")).catch(() => vscanBadge("Tape le numéro dans le champ")); }
    else vscanBadge("Tape le numéro vu dans la loupe");
  }
  VS.timer = setInterval(async () => { const v = document.getElementById("vscan-vid"); if (v) await analyzeFrame(v); }, 1200);
  setTimeout(() => inp.focus(), 400);
}

function stopVideoScan(){
  clearInterval(VS.timer); VS.timer = null;
  if (VS.magRaf){ cancelAnimationFrame(VS.magRaf); VS.magRaf = null; }
  if (VS.stream){ VS.stream.getTracks().forEach(t => t.stop()); VS.stream = null; }
  if (VS.overlay){ VS.overlay.remove(); VS.overlay = null; }
  VS.buffer = []; VS.busy = false; VS.currentCands = null; VS.textDet = null;
}

async function analyzeFrame(vid){
  if (VS.busy || vid.readyState < 2) return;
  if (VS.cooldown && Date.now() < VS.cooldown) return;
  const W = vid.videoWidth, H = vid.videoHeight; if (!W) return;
  VS.busy = true;
  let number = "", total = "", setCode = "";
  try {
    if (VS.textDet) {
      const numCv = buildOcrCanvas(vid, Math.round(W*0.05), Math.round(H*0.76), Math.round(W*0.90), Math.round(H*0.22), 2);
      const texts = await VS.textDet.detect(numCv);
      for (const t of texts) { const p = parseOcrNumber(t.rawValue); if (normNum(p.number)){ number = p.number; total = p.total; setCode = p.setCode; break; } }
    } else if (_ocrWorker) {
      const numCv = buildOcrCanvas(vid, Math.round(W*0.05), Math.round(H*0.76), Math.round(W*0.90), Math.round(H*0.22), 4);
      await _ocrWorker.setParameters({tessedit_pageseg_mode:11});
      const { data:{text} } = await _ocrWorker.recognize(numCv);
      const p = parseOcrNumber(text.trim()); number = p.number; total = p.total; setCode = p.setCode;
    }
  } catch(e){}

  if (!normNum(number)){ VS.buffer = []; VS._lastNum = ""; VS.busy = false; return; }

  const numKey = normNum(number) + "/" + (total||"") + "/" + (setCode||"");
  let cands = VS._lastNum === numKey ? VS._lastCands : null;
  if (!cands) { cands = await lookupCard(number, total, setCode).catch(()=>[]); VS._lastNum = numKey; VS._lastCands = cands; }
  if (!cands.length){ vscanBadge(`${normNum(number)}${total?"/"+total:""} — introuvable`); VS.buffer = []; VS.busy = false; return; }

  const topId = cands[0].id;
  VS.buffer.push(topId); if (VS.buffer.length > 6) VS.buffer.shift();
  const conf = VS.buffer.filter(x => x === topId).length;
  if (conf >= 3){
    const query = `${normNum(number)}${total?"/"+total:""}`;
    const inp = document.getElementById("vscan-q");
    if (inp && inp.value !== query){ inp.value = query; vscanSearch(query, setCode); }
    vscanBadge(`${query} ✓`);
  } else {
    vscanBadge(`${normNum(number)}${total?"/"+total:""} — ${conf}/3`);
  }
  VS.busy = false;
}

function vscanBadge(text){
  const b = document.getElementById("vscan-badge");
  if (b){ b.textContent = text; b.classList.toggle("found", text.includes("✓")); }
}

async function vscanCapturePhoto(){
  const vid = document.getElementById("vscan-vid");
  if (!vid || vid.readyState < 2) { vscanBadge("Caméra pas prête"); return; }
  const W = vid.videoWidth, H = vid.videoHeight; if (!W) return;
  vscanBadge("Analyse…");

  // Capture compressée max 800px (suffisant pour Gemini, plus rapide)
  const r = Math.min(1, 800 / Math.max(W, H));
  const cv = document.createElement("canvas");
  cv.width = Math.round(W * r); cv.height = Math.round(H * r);
  cv.getContext("2d").drawImage(vid, 0, 0, cv.width, cv.height);

  // 1. Gemini via /api/scan (fiable, iOS + Android)
  try {
    const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.90));
    const b64 = await new Promise(res => { const rd = new FileReader(); rd.onload = e => res(e.target.result.split(",")[1]); rd.readAsDataURL(blob); });
    const resp = await fetch("/api/scan", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageBase64: b64, mimeType: "image/jpeg" })
    });
    if (resp.ok) {
      const g = await resp.json();
      const inp = document.getElementById("vscan-q");
      if (g.number) {
        const query = `${normNum(g.number)}${g.total ? "/" + g.total : ""}`;
        if (inp) inp.value = query;
        vscanSearch(query, g.setCode || ""); vscanBadge(query + " ✓"); return;
      }
      if (g.name) {
        if (inp) inp.value = g.name;
        vscanSearch(g.name, g.setCode || ""); vscanBadge(g.name.slice(0, 20) + " ✓"); return;
      }
    }
  } catch(e) {}

  // 2. Fallback OCR sur la zone numéro (Android Chrome / si Gemini indisponible)
  const cw = cv.width, ch = cv.height;
  const numCv = buildOcrCanvas(cv, Math.round(cw*0.05), Math.round(ch*0.78), Math.round(cw*0.90), Math.round(ch*0.20), 4);
  let number = "", total = "", setCode = "";
  if (VS.textDet) {
    try {
      const texts = await VS.textDet.detect(numCv);
      for (const t of texts) { const p = parseOcrNumber(t.rawValue); if (normNum(p.number)){ number = p.number; total = p.total; setCode = p.setCode; break; } }
    } catch(e){}
  }
  if (!normNum(number) && _ocrWorker) {
    try {
      await _ocrWorker.setParameters({tessedit_pageseg_mode:11});
      const { data:{text} } = await _ocrWorker.recognize(numCv);
      const p = parseOcrNumber(text.trim()); number = p.number; total = p.total; setCode = p.setCode;
    } catch(e){}
  }
  const inp = document.getElementById("vscan-q");
  if (normNum(number)) {
    const query = `${normNum(number)}${total?"/"+total:""}`;
    if (inp) inp.value = query; vscanSearch(query, setCode); vscanBadge(query + " ✓");
  } else {
    vscanBadge("Non reconnu — tape le numéro"); if (inp) inp.focus();
  }
}

async function vscanSearch(q, codeHint = ""){
  if (!q) return;
  const resDiv = document.getElementById("vscan-results"); if (!resDiv) return;
  resDiv.innerHTML = `<p class="muted" style="font-size:13px;margin:0">Recherche…</p>`;
  VS.currentCands = null;
  if (window._vsAutoAdd) { clearInterval(window._vsAutoAdd); window._vsAutoAdd = null; }
  const cf = document.getElementById("vscan-confirm"); if (cf) cf.hidden = true;

  let cands = [];
  const numM = q.match(/^0*(\d+)\s*[\/\-]\s*(\d+)$/);
  if (numM) cands = await lookupCard(numM[1], numM[2], codeHint);
  if (!cands.length) cands = await matchCard({name:q, number:numM?.[1]||"", total:numM?.[2]||"", setCode:codeHint, language:S.lang, variant:"normal"});

  VS.currentCands = cands;
  if (!cands.length){ resDiv.innerHTML=`<p class="muted" style="font-size:13px;margin:0">Aucun résultat — essaie un autre numéro ou nom.</p>`; return; }
  const sn = id => S.catalog?.sets?.[id]?.name?.slice(0,14) || id;

  if (cands.length === 1) {
    _vscanDoAdd(cands[0], resDiv);
  } else {
    VS.currentSel = 0;
    let t = 3;
    const renderPicker = () => {
      if (!resDiv.isConnected) return;
      resDiv.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Quelle édition ? <span id="vscan-cd" style="font-weight:700;color:var(--accent)">${t}s</span> → ajout auto</div><div class="vscard-grid">${cands.slice(0,8).map((c,i)=>`<button class="vscard" data-vscard="${i}" aria-pressed="${i===0}">${c.image?`<img src="${esc(c.image)}/low.webp" alt="" loading="lazy">`:`<span style="font-size:9px;padding:3px;text-align:center;word-break:break-word;color:var(--muted)">${esc(c.name)}</span>`}<small>${esc(sn(c.setId))} ${esc(c.localId)}</small></button>`).join("")}</div>`;
    };
    renderPicker();
    window._vsAutoAdd = setInterval(() => {
      t--;
      const ct = document.getElementById("vscan-cd");
      if (ct) ct.textContent = `${t}s`;
      if (t <= 0) {
        clearInterval(window._vsAutoAdd); window._vsAutoAdd = null;
        if (resDiv.isConnected) _vscanDoAdd(cands[VS.currentSel], resDiv);
      }
    }, 1000);
  }
}

function _vscanDoAdd(c, resDiv) {
  if (window._vsAutoAdd) { clearInterval(window._vsAutoAdd); window._vsAutoAdd = null; }
  VS.cooldown = Date.now() + 3500; VS._lastNum = "";
  const variant = VS.currentVariant || "normal";
  const doc = S.coll[c.id] ? {...S.coll[c.id]} : {kind:"card",cardId:c.id,setId:c.setId,name:c.name,localId:c.localId,image:c.image||"",v:{},cond:"Near Mint",wish:false,addedAt:Date.now(),lang:S.lang.toUpperCase().slice(0,2)};
  doc.v = {...doc.v,[variant]:(doc.v?.[variant]||0)+1}; doc.wish = false;
  Store.save(doc); toast(`${c.name} ajoutée (×${qty(doc)})`);
  if (!doc.prices) loadCard(c.id).then(cd=>{if(!cd?.pricing)return;const prices={};for(const[vk]of VARIANTS)prices[vk]=priceOf(cd.pricing,vk).main;const cur=S.coll[c.id];if(cur)Store.save({...cur,prices,priceSource:"Cardmarket via TCGdex",priceAt:Date.now()});}).catch(()=>{});
  VS.currentCands=null; VS.currentSel=0; VS.currentVariant="normal"; VS.buffer=[];
  document.getElementById("vscan-vars")?.querySelectorAll("[data-vsvar]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.vsvar==="normal"));
  const inp=document.getElementById("vscan-q"); if(inp) inp.value="";
  if (resDiv?.isConnected) resDiv.innerHTML=`<div class="vscan-found">${c.image?`<img src="${esc(c.image)}/low.webp" alt="">`:`<div style="width:56px;height:78px;border-radius:7px;background:var(--sunk);flex-shrink:0"></div>`}<div><div style="font-size:14px;font-weight:700">✅ ${esc(c.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(S.catalog?.sets?.[c.setId]?.name?.slice(0,18)||c.setId)} · #${esc(c.localId)}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">Pointe la carte suivante.</div></div></div>`;
  vscanBadge("✓ " + c.name.slice(0,20));
  setTimeout(()=>vscanBadge("Pointe le bas de la carte"),2500);
}

async function vscanAdd(){
  const cands = VS.currentCands; if (!cands?.length) return;
  _vscanDoAdd(cands[Math.min(VS.currentSel, cands.length-1)], document.getElementById("vscan-results"));
}

/* ---------- export ---------- */
async function exportCsv(){
  const rows = [["Nom","Extension","Numéro","Normale","Reverse","Holo","1re éd.","État","Langue","Gradée","Note grading","Prix payé","Cote unitaire €","Valeur €","Note"]];
  Object.values(S.coll).filter(d => qty(d)).forEach(d => rows.push([d.name, S.catalog?.sets?.[d.setId]?.name || d.setId, d.localId, d.v?.normal||0, d.v?.reverse||0, d.v?.holo||0, d.v?.first||0, d.cond||"", d.lang||"", d.grade?.co||"", d.grade?.note||"", d.paid ?? "", d.prices?.normal ?? "", (cardValue(d)??"") === "" ? "" : cardValue(d).toFixed(2), d.note||""]));
  const csv = "﻿" + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const link = document.createElement("a"); link.href = url; link.download = `collection-pokemon-${today()}.csv`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- interactions ---------- */
function quickAdd(id, cinfo){
  const set = S.setCache[S.lang + ":" + S.setView];
  const c = set?.cards?.find(x => x.id === id) || cinfo;
  const setId = c?.setId || S.setView || id.slice(0, id.lastIndexOf("-"));
  const prev = S.coll[id];
  const doc = prev
    ? {...prev, v:{...prev.v, normal:(prev.v?.normal||0)+1}, wish:false}
    : {kind:"card",cardId:id,setId,name:c?.name||"",localId:c?.localId||"",image:c?.image||"",v:{normal:1},cond:"Near Mint",wish:false,addedAt:Date.now(),lang:S.lang.toUpperCase().slice(0,2)};
  Store.save(doc);
  // Mise à jour visuelle locale du badge sans re-render complet
  const pockets = document.querySelectorAll(`[data-open="${CSS.escape(id)}"]`);
  const total = Object.values(doc.v||{}).reduce((s,v)=>s+(v||0),0);
  pockets.forEach(p => {
    p.classList.remove("missing");
    let qty = p.querySelector(".qty");
    if (total > 1) { if (!qty) { qty = document.createElement("span"); qty.className = "qty"; p.appendChild(qty); } qty.textContent = "×" + total; }
    else if (qty) qty.remove();
  });
  toast((c?.name||"Carte") + " ×" + total);
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function go(tab){ S.tab = tab; window.scrollTo(0,0); render(); if (tab === "search") $("#q")?.focus(); }

document.addEventListener("click", e => {
  if (e.target.closest(".scrim")) return;
  const qa = e.target.closest("[data-quickadd]"); if (qa) { const ci = qa.dataset.qacinfo ? JSON.parse(qa.dataset.qacinfo) : null; quickAdd(qa.dataset.quickadd, ci); return; }
  const b = e.target.closest("button,[data-act]"); if (!b) return;
  if (b.dataset.tab) return go(b.dataset.tab);
  if (b.dataset.lang && b.dataset.lang !== S.lang) { S.lang = b.dataset.lang; lsSet("lang", S.lang); S.setCache = {}; loadCatalog(); if (S.tab === "search") { $("#app").innerHTML = viewSearch(); } return; }
  if (b.dataset.serie) { const id = b.dataset.serie; S.openSeries.has(id) ? S.openSeries.delete(id) : S.openSeries.add(id); lsSet("openSeries", JSON.stringify([...S.openSeries])); return render(); }
  if (b.dataset.set) { S.setView = b.dataset.set; S.setFilter = "all"; S.setCatFilter = "all"; return go("set"); }
  if (b.dataset.filter) { S.setFilter = b.dataset.filter; return render(); }
  if (b.dataset.catfilter) { S.setCatFilter = b.dataset.catfilter; return render(); }
  if (b.dataset.list) { S.listTab = b.dataset.list; return render(); }
  if (b.dataset.open && !e.target.closest("[data-quickadd]")) {
    const deck = [...document.querySelectorAll("[data-open]")].map(el => el.dataset.open).filter((x,i,a) => x && a.indexOf(x)===i);
    return openCard(b.dataset.open, deck);
  }
  if (b.dataset.removescan) { const [i,k] = b.dataset.removescan.split(":").map(Number); S.scan[i].found.splice(k,1); return render(); }
  if (b.dataset.pick) { const [i,k,c] = b.dataset.pick.split(":").map(Number); S.scan[i].found[k].sel = c; return render(); }
  if (b.dataset.addall) {
    const i = parseInt(b.dataset.addall); const entry = S.scan[i]; let count = 0;
    for (let k = 0; k < entry.found.length; k++) {
      const f = entry.found[k]; if (!f.cands.length || f.added) continue;
      const c = f.cands[f.sel];
      const variant = $(`#var-${i}-${k}`)?.value || "normal";
      const doc = S.coll[c.id] ? {...S.coll[c.id]} : {kind:"card",cardId:c.id,setId:c.setId,name:c.name,localId:c.localId,image:c.image||"",v:{},cond:"Near Mint",wish:false,addedAt:Date.now(),lang:S.lang.toUpperCase()};
      doc.v = {...doc.v,[variant]:(doc.v?.[variant]||0)+1}; doc.wish = false; f.added = true;
      Store.save(doc); count++;
    }
    toast(`${count} carte(s) ajoutée(s).`); return render();
  }
  if (b.dataset.addscan) {
    const [i,k] = b.dataset.addscan.split(":").map(Number); const f = S.scan[i].found[k]; const c = f.cands[f.sel];
    const variant = $(`#var-${i}-${k}`)?.value || "normal";
    const doc = S.coll[c.id] ? {...S.coll[c.id]} : {kind:"card", cardId:c.id, setId:c.setId, name:c.name, localId:c.localId, image:c.image||"", v:{}, cond:"Near Mint", wish:false, addedAt:Date.now(), lang:(f.det.language||S.lang).toUpperCase().slice(0,2)};
    doc.v = {...doc.v, [variant]: (doc.v?.[variant]||0) + 1}; doc.wish = false; f.added = true;
    Store.save(doc); toast(`${c.name} ajoutée (×${qty(doc)})`);
    if (!doc.prices) loadCard(c.id).then(cd => { if (!cd?.pricing) return; const prices = {}; for (const [vk] of VARIANTS) prices[vk] = priceOf(cd.pricing, vk).main; const cur = S.coll[c.id]; if (cur) Store.save({...cur, prices, priceSource:"Cardmarket via TCGdex", priceAt:Date.now()}); }).catch(()=>{});
    return;
  }
  const act = b.dataset.act;
  if (act === "openprofile") { openProfile(); return; }
  if (act === "gendecks") { generateDecks(); return; }
  if (act === "toggledeckenergy") { const k=b.dataset.etype, i=S.deckEnergyFilter.indexOf(k); if(i>=0) S.deckEnergyFilter.splice(i,1); else if(S.deckEnergyFilter.length<2) S.deckEnergyFilter.push(k); saveDeckEnergyFilter(); render(); return; }
  if (act === "savedeck") { saveDeckFromAdvice(parseInt(b.dataset.didx||"0")); return; }
  if (act === "deldeck") { deleteDeck(b.dataset.deckid); return; }
  if (act === "editdeck") { openDeckEditor(b.dataset.deckid); return; }
  if (act === "startbattle") { openBattleSetup(b.dataset.deckid||""); return; }
  if (act === "newdeck") { const id="deck_"+Date.now(); S.decks[id]={id,name:"Mon deck",cards:[],strategy:"",createdAt:Date.now()}; saveDeckState(); render(); return; }
  if (act === "endbattle") { endBattle(); return; }
  if (act === "nextturn") { nextTurn(); return; }
  if (act === "appdmg") { applyDmg(parseInt(b.dataset.pidx),b.dataset.slot,parseInt(b.dataset.dmg)); return; }
  if (act === "custdmg") { const v = parseInt(prompt("Dégâts à infliger :")||"0"); if (v>0) applyDmg(parseInt(b.dataset.pidx),b.dataset.slot,v); return; }
  if (act === "healpoke") { healPoke(parseInt(b.dataset.pidx),b.dataset.slot,parseInt(b.dataset.heal||"10")); return; }
  if (act === "togglecond") { toggleCond(parseInt(b.dataset.pidx),b.dataset.cond); return; }
  if (act === "useattack") {
    const pIdx = parseInt(b.dataset.pidx), dmg = parseInt(b.dataset.dmg)||0, aname = b.dataset.aname;
    const opp = S.battleState.players[1-pIdx];
    if (!opp.active) { toast("Pas de Pokémon actif adverse !"); return; }
    if (dmg > 0) applyDmg(1-pIdx, "active", dmg);
    else battleLog(`T${S.battleState.turn} ⚡ <b>${S.battleState.players[pIdx].name}</b> utilise <b>${esc(aname)}</b> — dégâts variables, ajuste manuellement`);
    return;
  }
  if (act === "kopoke") { koPoke(parseInt(b.dataset.pidx)); return; }
  if (act === "takeprize") { takeprize(parseInt(b.dataset.pidx)); return; }
  if (act === "openpoke") { openPokePicker(parseInt(b.dataset.pidx),b.dataset.slot); return; }
  if (act === "energyadj") { const k=b.dataset.etype, d=parseInt(b.dataset.delta); S.energyStock[k]=Math.max(0,(S.energyStock[k]||0)+d); saveEnergyState(); render(); return; }
  if (act === "acct") return S.user ? Store.signOut() : Store.signIn();
  if (act === "scan") return go("scan");
  if (act === "startvideo") return startVideoScan();
  if (act === "gallery") return $("#photo-gallery").click();
  if (act === "page") return $("#photo-page").click();
  if (act === "importjson") return $("#import-json").click();
  if (act === "clearscan") { S.scan = []; return render(); }
  if (act === "refresh") return refreshPrices(b);
  if (act === "export") return exportCsv();
  if (act === "clearall") {
    const n = Object.keys(S.coll).length;
    if (!confirm(`Vider toute la collection ?\n${n} carte(s) seront supprimées définitivement.`)) return;
    const mot = prompt(`Pour confirmer, tape VIDER en majuscules :`);
    if (mot?.trim() !== "VIDER") { toast("Annulé."); return; }
    Store.clearAll(); return;
  }
  if (act === "back") return go("series");
  if (act === "reloadcat") return loadCatalog(true);
  if (act === "tosearch") { go("search"); const q = $("#q"); if (q) { q.value = b.dataset.q; doSearch(b.dataset.q.trim()); } }
  if (act === "reqnotif") { Notification.requestPermission().then(p => { if (p==="granted") toast("Alertes prix activées 🔔"); render(); }); return; }
  if (act === "analyzegrade") { analyzeForGrading(); return; }
  if (act === "getbuyadvice") { getBuyingAdvice(); return; }
  if (b.dataset.dismissalert) {
    const [cid, date] = b.dataset.dismissalert.split(":");
    S.priceAlerts = S.priceAlerts.map(a => a.cardId===cid && a.date===date ? {...a, dismissed:true} : a);
    try { lsSet("ctcg_alerts", JSON.stringify(S.priceAlerts)); } catch {}
    render(); return;
  }
});
document.addEventListener("input", e => { if (e.target.id === "q") { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => doSearch(v), 350); } });
$("#photo-gallery").addEventListener("change", e => { const files = [...e.target.files]; e.target.value = ""; if (files.length) scanFiles(files); });
$("#photo-page").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) scanPage(f); });
$("#import-json").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const rd = new FileReader();
  rd.onload = ev => { try { importJson(JSON.parse(ev.target.result)); } catch { toast("Fichier JSON invalide."); } };
  rd.readAsText(f);
});

render();
loadCatalog();
Store.init();
</script>
